// import/export 禁止。THREE はスコープにある前提。

/* ============================================================
   WebAudio SE 合成ユーティリティ
   ============================================================ */
var GameAudioCtx = null;

function GameGetAudioCtx() {
  if (!GameAudioCtx) {
    try {
      GameAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch(e) { GameAudioCtx = null; }
  }
  return GameAudioCtx;
}

// gain は 0..1
function GamePlaySplash(muted) {
  if (muted) return;
  var ctx = GameGetAudioCtx(); if (!ctx) return;
  var buf = ctx.createBuffer(1, ctx.sampleRate * 0.4, ctx.sampleRate);
  var data = buf.getChannelData(0);
  for (var i = 0; i < data.length; i++) {
    var t = i / ctx.sampleRate;
    data[i] = (Math.random() * 2 - 1) * Math.exp(-t * 18) * 0.6;
  }
  var src = ctx.createBufferSource();
  src.buffer = buf;
  var g = ctx.createGain(); g.gain.value = 0.5;
  src.connect(g); g.connect(ctx.destination);
  src.start();
}

function GamePlayDrag(muted) {
  if (muted) return;
  var ctx = GameGetAudioCtx(); if (!ctx) return;
  var dur = 0.35;
  var osc = ctx.createOscillator();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(320, ctx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(140, ctx.currentTime + dur);
  var g = ctx.createGain();
  g.gain.setValueAtTime(0.18, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
  osc.connect(g); g.connect(ctx.destination);
  osc.start(); osc.stop(ctx.currentTime + dur);
}

function GamePlayBite(muted) {
  if (muted) return;
  var ctx = GameGetAudioCtx(); if (!ctx) return;
  var osc = ctx.createOscillator();
  osc.type = 'square';
  osc.frequency.setValueAtTime(880, ctx.currentTime);
  osc.frequency.setValueAtTime(440, ctx.currentTime + 0.05);
  var g = ctx.createGain();
  g.gain.setValueAtTime(0.22, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);
  osc.connect(g); g.connect(ctx.destination);
  osc.start(); osc.stop(ctx.currentTime + 0.2);
}

function GamePlayFanfare(muted) {
  if (muted) return;
  var ctx = GameGetAudioCtx(); if (!ctx) return;
  var notes = [523, 659, 784, 1047];
  for (var i = 0; i < notes.length; i++) {
    (function(freq, offset) {
      var osc = ctx.createOscillator();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      var g = ctx.createGain();
      g.gain.setValueAtTime(0, ctx.currentTime + offset);
      g.gain.linearRampToValueAtTime(0.25, ctx.currentTime + offset + 0.04);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + offset + 0.28);
      osc.connect(g); g.connect(ctx.destination);
      osc.start(ctx.currentTime + offset);
      osc.stop(ctx.currentTime + offset + 0.3);
    })(notes[i], i * 0.12);
  }
}

/* ============================================================
   抽選ヘルパー
   ============================================================ */
function GameTimeSlot(p) {
  // p: 0..1  0=朝, 0.25=昼, 0.5=夕, 0.7=夜
  if (p >= 0.65 && p < 0.95) return 'night';
  if (p >= 0.45 && p < 0.65) return 'dusk';
  return 'day';
}

function GameCalcWeight(species, sizeCm) {
  var wA = species.weight.wA;
  var wB = species.weight.wB;
  return wA * Math.pow(sizeCm / 10, wB);
}

function GameRandRange(lo, hi) {
  return lo + Math.random() * (hi - lo);
}

/* ============================================================
   GameCore
   ============================================================ */
class GameCore {
  constructor(env, ui) {
    this._env = env;
    this._ui  = ui;

    // --- 状態 ---
    this.state = 'title'; // title|idle|casting|waiting|bite|fight|landed

    // --- 時間帯 (0..1、実時間4分で一周) ---
    this.timeOfDay = 0.1;  // 朝から始まる
    this._TOD_PERIOD = 240; // 秒

    // --- キャスト ---
    this._castPower   = 0;
    this._pressing    = false;
    this._castChargeT = 0;

    // --- ウキ ---
    this.floatObj = null;
    this._floatSinkTarget = 0;   // 0=浮, 1=消し込み
    this._floatSinkCur    = 0;
    this._bitePreTick     = 0;
    this._bitePreActive   = false;

    // --- 待ちタイマー ---
    this._waitTimer    = 0;
    this._waitDuration = 20;
    this._biteWindow   = 0;   // 本アタリ受付秒数
    this._biteState    = 0;   // 0=なし 1=前アタリ 2=本アタリ

    // --- ファイト ---
    this.lineTension  = 0;
    this.fishDistance = 30;
    this.fishStamina  = 1;
    this.hookedFish   = null;
    this._erraticT    = 0;

    // --- ランディング ---
    this._landedTimer = 0;
    this._catchShown  = false;

    // --- コイン/タックル/記録 ---
    this.coins    = 500;
    this.records  = {};
    this.equipped = { rod: 'rod_tanago', reel: 'reel_sazanami', rig: 'rig_tanuki_uki', bait: 'mushi' };
    this.owned    = { rods: ['rod_tanago'], reels: ['reel_sazanami'], rigs: ['rig_tanuki_uki'] };

    // --- サウンド ---
    this._muted = false;

    // --- ウキ THREE.Object3D ---
    this._initFloat();

    // --- ロード ---
    this.load();
  }

  /* ---------- ウキ初期化 ---------- */
  _initFloat() {
    if (this.floatObj) {
      if (this.floatObj.parent) this.floatObj.parent.remove(this.floatObj);
    }
    var g = new THREE.Group();
    // 細長い楕円ウキ
    var geo = new THREE.SphereGeometry(0.08, 10, 7);
    geo.scale(0.8, 3.0, 0.8);
    var mat = new THREE.MeshStandardMaterial({ color: 0xff4422, roughness: 0.5, metalness: 0.0 });
    var mesh = new THREE.Mesh(geo, mat);
    mesh.castShadow = true;
    g.add(mesh);
    // 下部アンテナ
    var aGeo = new THREE.CylinderGeometry(0.012, 0.006, 0.35, 6);
    var aMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.8 });
    var ant = new THREE.Mesh(aGeo, aMat);
    ant.position.y = -0.32;
    g.add(ant);
    g.position.set(0, 0.25, -18);
    this.floatObj = g;
  }

  /* ---------- save/load ---------- */
  save() {
    try {
      var data = {
        coins:    this.coins,
        records:  this.records,
        equipped: this.equipped,
        owned:    this.owned,
        muted:    this._muted
      };
      localStorage.setItem('turi-save-v1', JSON.stringify(data));
    } catch(e) {}
  }

  load() {
    try {
      var raw = localStorage.getItem('turi-save-v1');
      if (!raw) return;
      var data = JSON.parse(raw);
      if (data.coins    !== undefined) this.coins    = data.coins;
      if (data.records  !== undefined) this.records  = data.records;
      if (data.equipped !== undefined) this.equipped = data.equipped;
      if (data.owned    !== undefined) this.owned    = data.owned;
      if (data.muted    !== undefined) this._muted   = data.muted;
    } catch(e) {}
  }

  /* ---------- 入力 ---------- */
  pressStart() {
    if (this.state === 'idle') {
      this._pressing    = true;
      this._castChargeT = 0;
      this._castPower   = 0;
    } else if (this.state === 'bite') {
      // 本アタリ中にフッキング
      if (this._biteState === 2) {
        this._startFight();
      }
    } else if (this.state === 'fight') {
      this._pressing = true;
    }
  }

  pressEnd() {
    if (this.state === 'casting' || (this.state === 'idle' && this._pressing)) {
      // まだ idle で離した = キャスト実行
      if (this._pressing && this.state === 'idle') {
        this._doCast();
      }
      this._pressing = false;
    } else if (this.state === 'fight') {
      this._pressing = false;
    }
  }

  /* ---------- ゲーム開始(タイトル→idle) ---------- */
  startGame() {
    this.state = 'idle';
    if (this._ui) this._ui.setHUD({ state: 'idle', tension: 0, distance: 0, stamina: 1,
      coins: this.coins, time: this.timeOfDay, speciesHint: null });
    // floatObj をシーンから一旦外しておく(mainが管理)
  }

  /* ---------- メニュー再開 ---------- */
  resume() {
    // メニューから戻るだけ
  }

  /* ---------- サウンドトグル ---------- */
  toggleSound() {
    this._muted = !this._muted;
    this.save();
  }

  /* ---------- equip ---------- */
  equip(cat, id) {
    if (cat === 'rod')  { if (this.owned.rods.indexOf(id)   >= 0) this.equipped.rod  = id; }
    if (cat === 'reel') { if (this.owned.reels.indexOf(id)  >= 0) this.equipped.reel = id; }
    if (cat === 'rig')  { if (this.owned.rigs.indexOf(id)   >= 0) this.equipped.rig  = id; }
    if (cat === 'bait') { this.equipped.bait = id; }
    this.save();
  }

  /* ---------- buy ---------- */
  buy(cat, id) {
    var lists = { rod: TACKLE_RODS, reel: TACKLE_REELS, rig: TACKLE_RIGS, bait: TACKLE_BAITS };
    var list = lists[cat]; if (!list) return false;
    var item = null;
    for (var i = 0; i < list.length; i++) { if (list[i].id === id) { item = list[i]; break; } }
    if (!item) return false;
    if (this.coins < item.price) return false;
    this.coins -= item.price;
    if (cat === 'rod'  && this.owned.rods.indexOf(id)  < 0) this.owned.rods.push(id);
    if (cat === 'reel' && this.owned.reels.indexOf(id) < 0) this.owned.reels.push(id);
    if (cat === 'rig'  && this.owned.rigs.indexOf(id)  < 0) this.owned.rigs.push(id);
    this.save();
    return true;
  }

  /* ---------- 釣果モーダル閉じる ---------- */
  dismissCatch() {
    this._catchShown = false;
    this._goIdle();
  }

  /* ============================================================
     メインアップデート
     ============================================================ */
  update(t, dt) {
    // 時間帯進行
    this.timeOfDay = (this.timeOfDay + dt / this._TOD_PERIOD) % 1;
    if (this._env && this._env.setTimeOfDay) this._env.setTimeOfDay(this.timeOfDay);

    switch (this.state) {
      case 'title':   this._updateTitle(t, dt);   break;
      case 'idle':    this._updateIdle(t, dt);    break;
      case 'casting': this._updateCasting(t, dt); break;
      case 'waiting': this._updateWaiting(t, dt); break;
      case 'bite':    this._updateBite(t, dt);    break;
      case 'fight':   this._updateFight(t, dt);   break;
      case 'landed':  this._updateLanded(t, dt);  break;
    }

    // ウキの波同期
    this._updateFloat(t, dt);

    // HUD更新
    if (this._ui && this.state !== 'title') {
      this._ui.setHUD({
        state:       this.state,
        tension:     this.lineTension,
        distance:    this.fishDistance,
        stamina:     this.fishStamina,
        coins:       this.coins,
        time:        this.timeOfDay,
        speciesHint: (this.hookedFish && this.hookedFish.species) ? this.hookedFish.species.name : null
      });
    }
  }

  /* ---------- 各状態 ---------- */
  _updateTitle(t, dt) {}

  _updateIdle(t, dt) {
    if (this._pressing) {
      this._castChargeT += dt;
      this._castPower = Math.min(1, this._castChargeT / 2.0);
      if (this._ui) this._ui.setCastPower(this._castPower);
      if (this._castChargeT >= 2.2) {
        // 満杯で自動キャスト
        this._doCast();
      }
    } else {
      if (this._castPower > 0) {
        this._castPower = 0;
        if (this._ui) this._ui.setCastPower(0);
      }
    }
  }

  _doCast() {
    this._pressing = false;
    this.state = 'casting';
    var power = Math.max(0.15, this._castPower);
    this._castPower = 0;
    if (this._ui) this._ui.setCastPower(0);
    // キャスト距離: 10m〜40m
    var dist = 10 + power * 30;
    this.floatObj.position.set(
      (Math.random() - 0.5) * dist * 0.4,
      5,
      -dist
    );
    this._castingT = 0;
    this._castingDist = dist;
  }

  _updateCasting(t, dt) {
    this._castingT += dt;
    if (this._castingT >= 0.8) {
      // 着水
      this.state = 'waiting';
      GamePlaySplash(this._muted);
      this._startWaiting();
    }
  }

  _startWaiting() {
    // 抽選タイマー: 10〜30s
    this._waitTimer    = 0;
    this._waitDuration = 10 + Math.random() * 20;
    this._biteState    = 0;
    this._bitePreActive = false;
    this._floatSinkTarget = 0;
    if (this._ui) this._ui.showBite(0);
  }

  _updateWaiting(t, dt) {
    this._waitTimer += dt;

    // 前アタリ (70% of duration)
    if (!this._bitePreActive && this._waitTimer >= this._waitDuration * 0.7) {
      this._bitePreActive = true;
      this._bitePreTick   = 0;
      this._biteState     = 1;
      if (this._ui) this._ui.showBite(1);
      this._floatSinkTarget = 0.35; // ピクッ
    }

    // 前アタリのピクッは短時間で戻す
    if (this._bitePreActive && this._biteState === 1) {
      this._bitePreTick += dt;
      if (this._bitePreTick > 0.6) {
        this._floatSinkTarget = 0;
        if (this._bitePreTick > 1.2) this._biteState = 0;
      }
    }

    if (this._waitTimer >= this._waitDuration) {
      // 本アタリ
      this.state = 'bite';
      this._biteState = 2;
      this._floatSinkTarget = 1.0;
      this._biteWindow = 0;
      GamePlayBite(this._muted);
      if (this._ui) this._ui.showBite(2);
    }
  }

  _updateBite(t, dt) {
    this._biteWindow += dt;
    if (this._biteWindow > 1.2) {
      // 逃した
      this._biteState = 0;
      this._floatSinkTarget = 0;
      if (this._ui) this._ui.showBite(0);
      // エサ取られる確率30%
      var baitTaken = Math.random() < 0.3;
      if (baitTaken) {
        // ウキを回収して再キャスト促す
        this._goIdle();
      } else {
        this.state = 'waiting';
        this._startWaiting();
      }
    }
  }

  _startFight() {
    // 魚抽選
    var fish = this._drawFish();
    if (!fish) { this._goIdle(); return; }
    this.hookedFish = fish;
    this.state = 'fight';
    this._pressing = false;
    this.lineTension  = 0.2;
    this.fishDistance = 15 + Math.random() * 20;
    this.fishStamina  = fish.species.fight.stamina;
    this._erraticT    = 0;
    this._floatSinkTarget = 1.0;
    if (this._ui) this._ui.showBite(0);
  }

  _updateFight(t, dt) {
    var fish    = this.hookedFish;
    var sp      = fish.species;
    var rod     = this._getRod();
    var reel    = this._getReel();
    var powerFactor  = 0.4 + rod.power  * 0.12;
    var dragFactor   = 0.3 + reel.drag  * 0.10;

    // スタミナ減少
    this.fishStamina = Math.max(0, this.fishStamina - dt * 0.04);

    // erratic走り
    this._erraticT += dt;
    var erraticThresh = 2.5 - sp.fight.erratic * 1.5;
    var rushing = false;
    if (this._erraticT > erraticThresh && Math.random() < sp.fight.erratic * dt * 1.5) {
      this._erraticT = 0;
      rushing = true;
      GamePlayDrag(this._muted);
    }

    if (this._pressing) {
      // リール中: 距離減、テンション増
      var reelSpeed  = (reel.speed / 5) * 4;
      var reduction  = reelSpeed * dt * (0.3 + this.fishStamina * 0.7);
      this.fishDistance = Math.max(0, this.fishDistance - reduction);
      this.lineTension  = Math.min(1.2, this.lineTension + dt * (sp.fight.power * powerFactor + 0.15));
    } else {
      // テンション下がる
      this.lineTension = Math.max(0, this.lineTension - dt * dragFactor);
    }

    if (rushing) {
      this.fishDistance += sp.fight.power * (3 + Math.random() * 4);
      this.lineTension   = Math.min(1.1, this.lineTension + 0.25);
    }

    // テンション超過 = ライン破断
    if (this.lineTension > 1.0) {
      this._lineBreak();
      return;
    }

    // 距離0 = ランディング
    if (this.fishDistance <= 0) {
      this.fishDistance = 0;
      this._doLanding();
      return;
    }

    // 時間経過で魚が弱る
    if (this.fishStamina <= 0) {
      this.fishDistance = Math.max(0, this.fishDistance - dt * 6);
      if (this.fishDistance <= 0) { this._doLanding(); return; }
    }
  }

  _lineBreak() {
    this.hookedFish = null;
    this.lineTension = 0;
    this._floatSinkTarget = 0;
    this._goIdle();
  }

  _doLanding() {
    this.state = 'landed';
    this._landedTimer = 0;
    this._catchShown  = false;
    this.lineTension  = 0;
    this._floatSinkTarget = 0;
  }

  _updateLanded(t, dt) {
    this._landedTimer += dt;
    if (!this._catchShown && this._landedTimer > 0.5) {
      this._catchShown = true;
      var fish = this.hookedFish;
      if (fish) {
        var sp      = fish.species;
        var sizeCm  = fish.sizeCm;
        var wt      = GameCalcWeight(sp, sizeCm);
        // コイン計算: price×サイズ比×レア倍率
        var sizeRatio  = sizeCm / ((sp.minSize + sp.maxSize) / 2);
        var rareMult   = 1 + (sp.rarity - 1) * 0.4;
        var coins      = Math.round(sp.price * sizeCm * sizeRatio * rareMult * 0.1);
        this.coins += coins;
        // records
        var isNew    = false;
        var isRecord = false;
        if (!this.records[sp.id]) {
          this.records[sp.id] = { count: 0, maxSize: 0 };
          isNew = true;
        }
        this.records[sp.id].count++;
        if (sizeCm > this.records[sp.id].maxSize) {
          this.records[sp.id].maxSize = sizeCm;
          if (!isNew) isRecord = true;
        }
        this.save();
        GamePlayFanfare(this._muted);
        if (this._ui) this._ui.showCatch(sp, sizeCm, wt, coins, isNew, isRecord);
      }
    }
  }

  /* ---------- floatObj 更新 ---------- */
  _updateFloat(t, dt) {
    if (!this.floatObj) return;
    var fo = this.floatObj;

    // 沈み補間
    this._floatSinkCur += (this._floatSinkTarget - this._floatSinkCur) * Math.min(1, dt * 5);

    if (this.state === 'casting' || this.state === 'idle' || this.state === 'title') {
      // 水面下に隠す
      fo.visible = false;
      return;
    }
    fo.visible = true;

    // 波高さ同期
    var wh = 0;
    if (this._env && this._env.getWaveHeight) {
      wh = this._env.getWaveHeight(fo.position.x, fo.position.z, t);
    }
    fo.position.y = wh + 0.18 - this._floatSinkCur * 0.6;

    // ウキの揺れ
    if (this._bitePreActive && this._biteState === 1) {
      fo.position.y += Math.sin(t * 18) * 0.05 * this._floatSinkTarget;
    }
  }

  /* ---------- 魚抽選 ---------- */
  _drawFish() {
    var slot    = GameTimeSlot(this.timeOfDay);
    var rigData = this._getRig();
    var baitId  = this.equipped.bait;
    var rigDepth = rigData ? rigData.depth : 'mid';

    var weighted = [];
    var total    = 0;

    for (var i = 0; i < SPECIES.length; i++) {
      var sp = SPECIES[i];
      var w  = 1.0;

      // 棚一致
      var habitatMatch = false;
      for (var h = 0; h < sp.habitat.length; h++) {
        if (sp.habitat[h] === rigDepth) { habitatMatch = true; break; }
      }
      if (!habitatMatch) w *= 0.1;

      // baitPref
      var pref = sp.baitPref[baitId] !== undefined ? sp.baitPref[baitId] : 1.0;
      w *= pref;

      // 時間帯
      var timeMatch = false;
      for (var a = 0; a < sp.active.length; a++) {
        if (sp.active[a] === slot) { timeMatch = true; break; }
      }
      if (!timeMatch) w *= 0.25;

      // rarity (高いほど出にくい)
      var rarityFactor = Math.pow(0.45, sp.rarity - 1);
      w *= rarityFactor;

      // fantasy 合計約2% → さらに抑制
      if (sp.category === 'fantasy') {
        w *= 0.04;
        // 夜は微増
        if (slot === 'night') w *= 1.8;
      }

      if (w > 0) {
        weighted.push({ sp: sp, w: w });
        total += w;
      }
    }

    if (total === 0 || weighted.length === 0) return null;

    var r = Math.random() * total;
    var cum = 0;
    var chosen = weighted[0].sp;
    for (var j = 0; j < weighted.length; j++) {
      cum += weighted[j].w;
      if (r <= cum) { chosen = weighted[j].sp; break; }
    }

    var sizeCm = GameRandRange(chosen.minSize, chosen.maxSize);
    return { species: chosen, sizeCm: sizeCm };
  }

  /* ---------- タックル取得ヘルパー ---------- */
  _getRod() {
    for (var i = 0; i < TACKLE_RODS.length; i++) {
      if (TACKLE_RODS[i].id === this.equipped.rod) return TACKLE_RODS[i];
    }
    return TACKLE_RODS[0];
  }
  _getReel() {
    for (var i = 0; i < TACKLE_REELS.length; i++) {
      if (TACKLE_REELS[i].id === this.equipped.reel) return TACKLE_REELS[i];
    }
    return TACKLE_REELS[0];
  }
  _getRig() {
    for (var i = 0; i < TACKLE_RIGS.length; i++) {
      if (TACKLE_RIGS[i].id === this.equipped.rig) return TACKLE_RIGS[i];
    }
    return TACKLE_RIGS[0];
  }

  /* ---------- idle 遷移 ---------- */
  _goIdle() {
    this.state = 'idle';
    this.lineTension  = 0;
    this.fishDistance = 0;
    this.fishStamina  = 1;
    this.hookedFish   = null;
    this._pressing    = false;
    this._biteState   = 0;
    this._floatSinkTarget = 0;
    this._floatSinkCur    = 0;
    if (this.floatObj) this.floatObj.visible = false;
  }
}


//============== 05_ui.js ==============
/* ============================================================
   05_ui.js — UIController
   チヌ釣り三昧 UI 全実装
   import/export 禁止。トップレベル接頭辞: UI*
   ============================================================ */

/* ---------- SVGシルエット生成ヘルパー ---------- */

/**
 * 魚種の model から「ちゃんと魚に見える」SVGシルエットを生成。
 * 3次ベジェで口先→背中→尾柄→尾ひれ→腹→口先を閉じる。
 * 背鰭・臀鰭・胸鰭の突起、目も描画。
 * profile別にボディ形状を変える:
 *   standard/deep/slender/round → 通常の魚
 *   flat  → ヒラメ型(横長・両目が上面)
 *   eel   → 細長いS字体型
 *   squid → イカ型(外套+脚束+三角ひれ)
 */
function UIBuildFishSVG(species, filled, w, h) {
  w = w || 80;
  h = h || 52;
  var m = (species && species.model) ? species.model : {};
  var profile = m.profile || 'standard';
  var tail    = m.tail    || 'forked';
  var bodyH   = (m.bodyH  !== undefined) ? m.bodyH  : 0.30;
  var isCat   = species && species.category === 'fantasy';

  // 色セット
  var strokeColor = filled ? '#555' : (isCat ? '#a03cdc' : '#338866');
  var bodyFill  = filled ? '#2e2e2e' : (m.colors ? (m.colors.base  || '#6a8fa0') : '#6a8fa0');
  var bellyCol  = filled ? '#2e2e2e' : (m.colors ? (m.colors.belly || '#e8e8e0') : '#e8e8e0');
  var backCol   = filled ? '#2e2e2e' : (m.colors ? (m.colors.back  || '#223344') : '#223344');
  var finFill   = filled ? '#3a3a3a' : (m.colors ? (m.colors.fins  || '#557788') : '#557788');
  var eyeColor  = filled ? '#222'    : (m.colors ? (m.colors.eye   || '#111111') : '#111111');

  var gid = 'fg-' + (species ? species.id : 'unk') + '-' + (filled ? 'u' : 'k');
  var gidFin = gid + 'f';

  // ---- ヘルパー ----
  function f(n) { return Math.round(n * 10) / 10; }
  function pt(x, y) { return f(x) + ',' + f(y); }

  // =====================================================================
  // SQUID — イカ型
  // =====================================================================
  if (profile === 'squid') {
    // 外套: 中央右に縦長の流線型
    var mx = w * 0.52;
    var my = h * 0.50;
    var mw = w * 0.32;  // 半幅
    var mh = h * 0.40;  // 半高
    // 外套パス: 頭側(右)→先端三角(左)
    // 右(前端)は丸め、左(後端)は尖る
    var mRx = mx + mw;
    var mLx = mx - mw;
    var mTop = my - mh;
    var mBot = my + mh;
    // 三角ひれ
    var finW = mw * 0.55;
    var finH = mh * 0.50;
    var mantlePath =
      'M ' + f(mRx) + ' ' + f(my)
      + ' C ' + f(mRx) + ',' + f(my - mh*0.65) + ' ' + f(mx + mw*0.5) + ',' + f(mTop) + ' ' + f(mx) + ',' + f(mTop)
      + ' C ' + f(mx - mw*0.6) + ',' + f(mTop) + ' ' + f(mLx) + ',' + f(my - mh*0.3) + ' ' + f(mLx) + ',' + f(my)
      + ' C ' + f(mLx) + ',' + f(my + mh*0.3) + ' ' + f(mx - mw*0.6) + ',' + f(mBot) + ' ' + f(mx) + ',' + f(mBot)
      + ' C ' + f(mx + mw*0.5) + ',' + f(mBot) + ' ' + f(mRx) + ',' + f(my + mh*0.65) + ' ' + f(mRx) + ',' + f(my)
      + ' Z';
    // 三角ひれ(後端両側)
    var fintPath =
      'M ' + f(mLx + mw*0.2) + ',' + f(mTop + mh*0.3)
      + ' L ' + f(mLx - finW*0.5) + ',' + f(mTop)
      + ' L ' + f(mLx) + ',' + f(my - mh*0.1)
      + ' Z'
      + ' M ' + f(mLx + mw*0.2) + ',' + f(mBot - mh*0.3)
      + ' L ' + f(mLx - finW*0.5) + ',' + f(mBot)
      + ' L ' + f(mLx) + ',' + f(my + mh*0.1)
      + ' Z';
    // 脚束: 外套右端から8本
    var legBaseX = mRx - mw * 0.05;
    var legSpacing = mh * 0.18;
    var legs = '';
    for (var li = 0; li < 8; li++) {
      var legY0 = my + (li - 3.5) * legSpacing;
      var legLen = (li === 3 || li === 4) ? mw * 0.85 : mw * 0.60;
      var legCurve = (li < 4) ? -legLen * 0.2 : legLen * 0.2;
      legs += '<path d="M ' + f(legBaseX) + ',' + f(legY0)
        + ' Q ' + f(legBaseX + legLen*0.5) + ',' + f(legY0 + legCurve)
        + ' ' + f(legBaseX + legLen) + ',' + f(legY0 + legCurve * 1.5)
        + '" fill="none" stroke="' + finFill + '" stroke-width="1" opacity="0.85"/>';
    }
    // 目(外套前部左右)
    var eyeRsq = Math.max(2.5, mh * 0.20);
    var eyeXsq = mRx - mw * 0.55;
    var svgSq = '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '">'
      + '<defs>'
      + '<linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1">'
      + '<stop offset="0%" stop-color="' + backCol + '"/>'
      + '<stop offset="55%" stop-color="' + bodyFill + '"/>'
      + '<stop offset="100%" stop-color="' + bellyCol + '"/>'
      + '</linearGradient></defs>'
      + '<path d="' + fintPath + '" fill="' + finFill + '" stroke="' + strokeColor + '" stroke-width="0.7" opacity="0.85"/>'
      + '<path d="' + mantlePath + '" fill="url(#' + gid + ')" stroke="' + strokeColor + '" stroke-width="0.9"/>'
      + legs;
    if (!filled) {
      svgSq += '<circle cx="' + f(eyeXsq) + '" cy="' + f(my - mh*0.22) + '" r="' + f(eyeRsq) + '" fill="' + eyeColor + '"/>'
        + '<circle cx="' + f(eyeXsq - eyeRsq*0.28) + '" cy="' + f(my - mh*0.22 - eyeRsq*0.28) + '" r="' + f(eyeRsq*0.28) + '" fill="rgba(255,255,255,0.65)"/>';
    }
    svgSq += '</svg>';
    return svgSq;
  }

  // =====================================================================
  // EEL — 細長いS字体型 (タチウオ・アナゴ・ウツボ等)
  // =====================================================================
  if (profile === 'eel') {
    // 胴体は細長い帯状の多角形。S字のうねりを表現
    var ew = w * 0.92;
    var eh = h * 0.22;  // 半高
    var ecx = w * 0.50;
    var ecy = h * 0.50;
    // 口先(右端)から尾(左端)へS字
    var eRx = ecx + ew * 0.46;
    var eLx = ecx - ew * 0.46;
    // S字の振れ: 前半は上、後半は下(軽め)
    var sMid1x = ecx + ew * 0.12;
    var sMid2x = ecx - ew * 0.12;
    var sAmp = eh * 0.6; // 振れ幅
    // 背側パス
    var eelBody =
      'M ' + f(eRx) + ',' + f(ecy)
      + ' C ' + f(eRx - ew*0.07) + ',' + f(ecy - eh*0.5)
      + ' ' + f(sMid1x + ew*0.1) + ',' + f(ecy - eh - sAmp*0.6)
      + ' ' + f(sMid1x) + ',' + f(ecy - eh)
      + ' C ' + f(sMid1x - ew*0.12) + ',' + f(ecy - eh + sAmp*0.5)
      + ' ' + f(sMid2x + ew*0.05) + ',' + f(ecy - eh*0.2 + sAmp*0.4)
      + ' ' + f(eLx + ew*0.05) + ',' + f(ecy - eh*0.3)
      + ' L ' + f(eLx) + ',' + f(ecy)
      // 腹側(逆方向)
      + ' C ' + f(eLx + ew*0.05) + ',' + f(ecy + eh*0.3)
      + ' ' + f(sMid2x + ew*0.05) + ',' + f(ecy + eh*0.2 - sAmp*0.4)
      + ' ' + f(sMid2x) + ',' + f(ecy + eh)
      + ' C ' + f(sMid2x + ew*0.08) + ',' + f(ecy + eh - sAmp*0.5)
      + ' ' + f(sMid1x) + ',' + f(ecy + eh)
      + ' ' + f(sMid1x) + ',' + f(ecy + eh)
      + ' C ' + f(sMid1x + ew*0.12) + ',' + f(ecy + eh*0.5)
      + ' ' + f(eRx - ew*0.07) + ',' + f(ecy + eh*0.5)
      + ' ' + f(eRx) + ',' + f(ecy)
      + ' Z';
    // 背びれ(長い)
    var eelDorsal = 'M ' + f(eRx - ew*0.08) + ',' + f(ecy - eh*0.9)
      + ' Q ' + f(ecx) + ',' + f(ecy - eh - h*0.12)
      + ' ' + f(eLx + ew*0.08) + ',' + f(ecy - eh*0.9);
    // 目(右端に近い位置)
    var eelEyeX = eRx - ew * 0.07;
    var eelEyeY = ecy - eh * 0.25;
    var eelEyeR = Math.max(2, eh * 0.30);

    var svgEel = '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '">'
      + '<defs>'
      + '<linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1">'
      + '<stop offset="0%" stop-color="' + backCol + '"/>'
      + '<stop offset="50%" stop-color="' + bodyFill + '"/>'
      + '<stop offset="100%" stop-color="' + bellyCol + '"/>'
      + '</linearGradient></defs>'
      + '<path d="' + eelDorsal + '" fill="none" stroke="' + finFill + '" stroke-width="1.5" opacity="0.75"/>'
      + '<path d="' + eelBody + '" fill="url(#' + gid + ')" stroke="' + strokeColor + '" stroke-width="0.9"/>';
    if (!filled) {
      svgEel += '<circle cx="' + f(eelEyeX) + '" cy="' + f(eelEyeY) + '" r="' + f(eelEyeR) + '" fill="' + eyeColor + '"/>'
        + '<circle cx="' + f(eelEyeX - eelEyeR*0.3) + '" cy="' + f(eelEyeY - eelEyeR*0.3) + '" r="' + f(eelEyeR*0.28) + '" fill="rgba(255,255,255,0.65)"/>';
    }
    svgEel += '</svg>';
    return svgEel;
  }

  // =====================================================================
  // FLAT — ヒラメ・エイ型 (横から見た扁平魚)
  // =====================================================================
  if (profile === 'flat') {
    // 横長の菱形に近い形、前後に丸みを持たせる
    var fcx = w * 0.48;
    var fcy = h * 0.52;
    var frx = w * 0.42;  // 横方向
    var fry = h * 0.34;  // 縦方向(薄い)
    // 口先(右)は少し尖る、尾(左)も尖る
    var fHead = fcx + frx;
    var fTail = fcx - frx;
    var fTop = fcy - fry;
    var fBot = fcy + fry;
    // 上輪郭: 右→背中高み(少し前より)→左
    // 下輪郭: 左→腹→右
    var flatBody =
      'M ' + f(fHead) + ',' + f(fcy)
      + ' C ' + f(fHead - frx*0.12) + ',' + f(fcy - fry*0.7)
      + ' ' + f(fcx + frx*0.25) + ',' + f(fTop)
      + ' ' + f(fcx - frx*0.1) + ',' + f(fTop)
      + ' C ' + f(fcx - frx*0.55) + ',' + f(fTop)
      + ' ' + f(fTail + frx*0.08) + ',' + f(fcy - fry*0.4)
      + ' ' + f(fTail) + ',' + f(fcy)
      + ' C ' + f(fTail + frx*0.08) + ',' + f(fcy + fry*0.4)
      + ' ' + f(fcx - frx*0.55) + ',' + f(fBot)
      + ' ' + f(fcx - frx*0.1) + ',' + f(fBot)
      + ' C ' + f(fcx + frx*0.25) + ',' + f(fBot)
      + ' ' + f(fHead - frx*0.12) + ',' + f(fcy + fry*0.7)
      + ' ' + f(fHead) + ',' + f(fcy)
      + ' Z';
    // 目2つ(上面左右)
    var fEyeR = Math.max(2, fry * 0.22);
    var fEye1x = fcx + frx * 0.38;
    var fEye2x = fcx + frx * 0.18;
    var fEyeY = fcy - fry * 0.45;
    // 背びれ(上縁に沿った細い突起)
    var fDorsal = 'M ' + f(fHead - frx*0.22) + ',' + f(fTop + fry*0.1)
      + ' Q ' + f(fcx) + ',' + f(fTop - h*0.08)
      + ' ' + f(fTail + frx*0.20) + ',' + f(fTop + fry*0.1);
    // 尾ひれ
    var fTailSpread = fry * 0.85;
    var fTailPath = 'M ' + f(fTail) + ',' + f(fcy - fry*0.3)
      + ' C ' + f(fTail - frx*0.14) + ',' + f(fcy - fTailSpread)
      + ' ' + f(fTail - frx*0.14) + ',' + f(fcy - fTailSpread)
      + ' ' + f(fTail - frx*0.22) + ',' + f(fcy - fTailSpread * 0.85)
      + ' M ' + f(fTail - frx*0.22) + ',' + f(fcy - fTailSpread * 0.85)
      + ' C ' + f(fTail - frx*0.1) + ',' + f(fcy - fTailSpread*0.2)
      + ' ' + f(fTail - frx*0.1) + ',' + f(fcy + fTailSpread*0.2)
      + ' ' + f(fTail - frx*0.22) + ',' + f(fcy + fTailSpread * 0.85)
      + ' M ' + f(fTail - frx*0.22) + ',' + f(fcy + fTailSpread * 0.85)
      + ' C ' + f(fTail - frx*0.14) + ',' + f(fcy + fTailSpread)
      + ' ' + f(fTail - frx*0.14) + ',' + f(fcy + fTailSpread)
      + ' ' + f(fTail) + ',' + f(fcy + fry*0.3);

    var svgFlat = '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '">'
      + '<defs>'
      + '<linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1">'
      + '<stop offset="0%" stop-color="' + backCol + '"/>'
      + '<stop offset="60%" stop-color="' + bodyFill + '"/>'
      + '<stop offset="100%" stop-color="' + bellyCol + '"/>'
      + '</linearGradient></defs>'
      + '<path d="' + fDorsal + '" fill="none" stroke="' + finFill + '" stroke-width="1.2" opacity="0.8"/>'
      + '<path d="' + flatBody + '" fill="url(#' + gid + ')" stroke="' + strokeColor + '" stroke-width="0.9"/>'
      + '<path d="' + fTailPath + '" fill="none" stroke="' + finFill + '" stroke-width="1.5" opacity="0.85"/>';
    if (!filled) {
      svgFlat += '<circle cx="' + f(fEye1x) + '" cy="' + f(fEyeY) + '" r="' + f(fEyeR) + '" fill="' + eyeColor + '"/>'
        + '<circle cx="' + f(fEye1x - fEyeR*0.28) + '" cy="' + f(fEyeY - fEyeR*0.28) + '" r="' + f(fEyeR*0.28) + '" fill="rgba(255,255,255,0.65)"/>'
        + '<circle cx="' + f(fEye2x) + '" cy="' + f(fEyeY) + '" r="' + f(fEyeR * 0.85) + '" fill="' + eyeColor + '"/>';
    }
    svgFlat += '</svg>';
    return svgFlat;
  }

  // =====================================================================
  // 通常の魚 (standard / deep / slender / round)
  // 口先→背中の盛り上がり→尾柄のくびれ→尾びれ→腹→口先を3次ベジェで。
  // =====================================================================

  // キャンバス上での各寸法を計算
  // 魚全体を w×h に収める。マージン少し確保。
  var marginX = w * 0.04;
  var marginY = h * 0.08;

  // bodyH に応じて体高を決める
  var bodyHpx; // 体の最大高さ(半値)
  if (profile === 'deep')    { bodyHpx = h * 0.40; }
  else if (profile === 'slender') { bodyHpx = h * 0.16; }
  else if (profile === 'round')   { bodyHpx = h * 0.34; }
  else { bodyHpx = h * (bodyH * 1.55 + 0.10); } // standard
  bodyHpx = Math.min(bodyHpx, h * 0.46);
  bodyHpx = Math.max(bodyHpx, h * 0.12);

  // 横方向の主要X座標
  var snoutShift = (m.snout === 'long') ? w * 0.09 : (m.snout === 'pointed' ? w * 0.04 : 0.0);
  var xHead = w - marginX - snoutShift;  // 口先X
  var xBodyMax = w * 0.62;               // 最大体高の位置
  var xPeduncle = w * 0.20;             // 尾柄くびれ位置
  var xTailBase = w * 0.12;             // 尾ひれ基部X

  // Y基準: 画面中央より少し上(背びれが上へ出るため)
  var cy = h * 0.52;

  // 口先Y(吻の形によってわずかに異なる)
  var snoutYOff = (m.snout === 'blunt') ? bodyHpx * 0.08 : 0;

  // 尾柄のくびれ(体高の比)
  var pedH = bodyHpx * 0.30;  // 尾柄半高

  // ── ボディパス(背側→尾→腹側→口先) ──
  // 背側: 口先→背中最高点→尾柄
  var dorsalPeak = cy - bodyHpx;                  // 背中最高点Y
  var dorsalPeakX = xBodyMax + (xHead - xBodyMax) * 0.15; // 少し前寄り

  // 腹側の最低点
  var ventPeak = cy + bodyHpx * 0.72;
  var ventPeakX = xBodyMax - (xBodyMax - xTailBase) * 0.15;

  // mouth Y (吻の中央)
  var mouthY = cy + snoutYOff;

  var bodyPath =
    // 口先へ
    'M ' + f(xHead) + ',' + f(mouthY)
    // 背側: 口先→背中の盛り上がり→尾柄
    + ' C ' + f(xHead - (xHead-xBodyMax)*0.30) + ',' + f(cy - bodyHpx * 0.55)
    + ' '   + f(dorsalPeakX) + ',' + f(dorsalPeak)
    + ' '   + f(xBodyMax) + ',' + f(dorsalPeak + bodyHpx*0.05)
    + ' C ' + f(xBodyMax - (xBodyMax-xPeduncle)*0.35) + ',' + f(cy - bodyHpx * 0.60)
    + ' '   + f(xPeduncle + (xBodyMax-xPeduncle)*0.25) + ',' + f(cy - pedH * 1.2)
    + ' '   + f(xPeduncle) + ',' + f(cy - pedH)
    // 尾柄から尾ひれ基部へ
    + ' C ' + f(xPeduncle - (xPeduncle-xTailBase)*0.55) + ',' + f(cy - pedH * 0.9)
    + ' '   + f(xTailBase + (xPeduncle-xTailBase)*0.2) + ',' + f(cy - pedH * 0.6)
    + ' '   + f(xTailBase) + ',' + f(cy);

  // ── 尾ひれ ──
  var tailSpread, tailTipX, notchX;
  var tailPaths = '';

  if (tail === 'forked') {
    tailSpread = bodyHpx * 0.82;
    tailTipX   = xTailBase - w * 0.14;
    notchX     = xTailBase - w * 0.06;
    // 上葉
    tailPaths +=
      ' L ' + f(xTailBase) + ',' + f(cy - pedH * 0.4)
      + ' C ' + f(notchX) + ',' + f(cy - tailSpread*0.35)
      + ' '   + f(tailTipX + w*0.03) + ',' + f(cy - tailSpread*0.75)
      + ' '   + f(tailTipX) + ',' + f(cy - tailSpread)
      // 切れ込み
      + ' C ' + f(tailTipX + w*0.04) + ',' + f(cy - tailSpread*0.55)
      + ' '   + f(xTailBase - w*0.03) + ',' + f(cy - pedH*0.15)
      + ' '   + f(xTailBase) + ',' + f(cy)
      // 下葉
      + ' C ' + f(xTailBase - w*0.03) + ',' + f(cy + pedH*0.15)
      + ' '   + f(tailTipX + w*0.04) + ',' + f(cy + tailSpread*0.55)
      + ' '   + f(tailTipX) + ',' + f(cy + tailSpread)
      + ' C ' + f(tailTipX + w*0.03) + ',' + f(cy + tailSpread*0.75)
      + ' '   + f(notchX) + ',' + f(cy + tailSpread*0.35)
      + ' '   + f(xTailBase) + ',' + f(cy + pedH*0.4);
  } else if (tail === 'lunate') {
    // 三日月形: 深く切れ込む
    tailSpread = bodyHpx * 1.0;
    tailTipX   = xTailBase - w * 0.20;
    var lNotchX = xTailBase - w * 0.04;
    tailPaths +=
      ' L ' + f(xTailBase) + ',' + f(cy - pedH * 0.5)
      + ' C ' + f(lNotchX) + ',' + f(cy - tailSpread*0.4)
      + ' '   + f(tailTipX + w*0.04) + ',' + f(cy - tailSpread*0.72)
      + ' '   + f(tailTipX) + ',' + f(cy - tailSpread)
      + ' C ' + f(tailTipX + w*0.06) + ',' + f(cy - tailSpread*0.5)
      + ' '   + f(lNotchX - w*0.01) + ',' + f(cy - pedH * 0.08)
      + ' '   + f(xTailBase) + ',' + f(cy)
      + ' C ' + f(lNotchX - w*0.01) + ',' + f(cy + pedH * 0.08)
      + ' '   + f(tailTipX + w*0.06) + ',' + f(cy + tailSpread*0.5)
      + ' '   + f(tailTipX) + ',' + f(cy + tailSpread)
      + ' C ' + f(tailTipX + w*0.04) + ',' + f(cy + tailSpread*0.72)
      + ' '   + f(lNotchX) + ',' + f(cy + tailSpread*0.4)
      + ' '   + f(xTailBase) + ',' + f(cy + pedH * 0.5);
  } else if (tail === 'rounded') {
    tailSpread = bodyHpx * 0.72;
    tailTipX   = xTailBase - w * 0.12;
    tailPaths +=
      ' L ' + f(xTailBase) + ',' + f(cy - pedH * 0.55)
      + ' C ' + f(tailTipX + w*0.04) + ',' + f(cy - tailSpread*0.55)
      + ' '   + f(tailTipX) + ',' + f(cy - tailSpread * 0.3)
      + ' '   + f(tailTipX) + ',' + f(cy)
      + ' C ' + f(tailTipX) + ',' + f(cy + tailSpread * 0.3)
      + ' '   + f(tailTipX + w*0.04) + ',' + f(cy + tailSpread*0.55)
      + ' '   + f(xTailBase) + ',' + f(cy + pedH * 0.55);
  } else if (tail === 'pointed') {
    tailSpread = bodyHpx * 0.52;
    tailTipX   = xTailBase - w * 0.16;
    tailPaths +=
      ' L ' + f(xTailBase) + ',' + f(cy - pedH * 0.45)
      + ' C ' + f(xTailBase - w*0.05) + ',' + f(cy - tailSpread*0.5)
      + ' '   + f(tailTipX + w*0.06) + ',' + f(cy - tailSpread*0.5)
      + ' '   + f(tailTipX) + ',' + f(cy)
      + ' C ' + f(tailTipX + w*0.06) + ',' + f(cy + tailSpread*0.5)
      + ' '   + f(xTailBase - w*0.05) + ',' + f(cy + tailSpread*0.5)
      + ' '   + f(xTailBase) + ',' + f(cy + pedH * 0.45);
  } else {
    // truncate: まっすぐ切れた尾
    tailSpread = bodyHpx * 0.70;
    tailTipX   = xTailBase - w * 0.07;
    tailPaths +=
      ' L ' + f(xTailBase) + ',' + f(cy - pedH * 0.52)
      + ' L ' + f(tailTipX) + ',' + f(cy - tailSpread)
      + ' L ' + f(tailTipX) + ',' + f(cy + tailSpread)
      + ' L ' + f(xTailBase) + ',' + f(cy + pedH * 0.52);
  }

  // 腹側: 尾ひれ基部→腹の丸み→口先
  bodyPath += tailPaths
    + ' C ' + f(xTailBase + (xPeduncle-xTailBase)*0.2) + ',' + f(cy + pedH * 0.6)
    + ' '   + f(xPeduncle - (xPeduncle-xTailBase)*0.25) + ',' + f(cy + pedH * 1.2)
    + ' '   + f(xPeduncle) + ',' + f(cy + pedH)
    + ' C ' + f(xPeduncle + (xBodyMax-xPeduncle)*0.30) + ',' + f(cy + bodyHpx * 0.62)
    + ' '   + f(ventPeakX) + ',' + f(ventPeak)
    + ' '   + f(xBodyMax) + ',' + f(ventPeak - bodyHpx*0.05)
    + ' C ' + f(xBodyMax + (xHead-xBodyMax)*0.30) + ',' + f(cy + bodyHpx * 0.55)
    + ' '   + f(xHead - (xHead-xBodyMax)*0.28) + ',' + f(mouthY + bodyHpx * 0.30)
    + ' '   + f(xHead) + ',' + f(mouthY)
    + ' Z';

  // ── 背鰭 (dorsal) ──
  var dorsalSVG = '';
  var dStart = m.dorsal ? m.dorsal.start : 0.28;
  var dEnd   = m.dorsal ? m.dorsal.end   : 0.62;
  var dH     = m.dorsal ? m.dorsal.h     : 0.10;
  var spiny  = m.dorsal ? m.dorsal.spiny : false;
  // 背鰭のX座標: 体長割合を画面座標に変換(右が口先=1.0、左が尾=0.0)
  var bodyLen = xHead - xTailBase;
  var dxStart = xTailBase + bodyLen * (1.0 - dEnd);
  var dxEnd   = xTailBase + bodyLen * (1.0 - dStart);
  var dxMid   = (dxStart + dxEnd) * 0.5;
  var dTopY   = dorsalPeak - h * dH * 0.8;
  // 背鰭基部Y(背中ライン上)
  var dBaseY  = dorsalPeak + bodyHpx * 0.06;
  dorsalSVG =
    'M ' + f(dxEnd) + ',' + f(dBaseY)
    + ' C ' + f(dxEnd - (dxEnd-dxMid)*0.3) + ',' + f(dBaseY - h*dH*0.5)
    + ' '   + f(dxMid + (dxEnd-dxMid)*0.2) + ',' + f(dTopY + h*dH*0.1)
    + ' '   + f(dxMid) + ',' + f(dTopY)
    + ' C ' + f(dxMid - (dxMid-dxStart)*0.2) + ',' + f(dTopY + h*dH*0.1)
    + ' '   + f(dxStart + (dxMid-dxStart)*0.3) + ',' + f(dBaseY - h*dH*0.4)
    + ' '   + f(dxStart) + ',' + f(dBaseY)
    + ' Z';

  // 棘条(spiny)があれば細い縦線を数本追加
  var spinySVG = '';
  if (spiny && !filled) {
    var spineCount = 5;
    for (var si = 0; si < spineCount; si++) {
      var sxRatio = (si + 0.5) / spineCount;
      var sx = dxEnd + (dxStart - dxEnd) * sxRatio;
      var sTopY2 = dTopY + (dxMid - sx) * (dxMid - sx) / (bodyLen * bodyLen * 0.04) * h * dH * 0.5;
      var sBaseY2 = dBaseY;
      spiny && (spinySVG += '<line x1="' + f(sx) + '" y1="' + f(sBaseY2) + '" x2="' + f(sx) + '" y2="' + f(sTopY2 + h*dH*0.12) + '" stroke="' + finFill + '" stroke-width="0.5" opacity="0.6"/>');
    }
  }

  // ── 臀鰭 (anal) ──
  var analSVG = '';
  var aStart = m.anal ? m.anal.start : 0.60;
  var aEnd   = m.anal ? m.anal.end   : 0.78;
  var aH     = m.anal ? m.anal.h     : 0.07;
  var axStart = xTailBase + bodyLen * (1.0 - aEnd);
  var axEnd   = xTailBase + bodyLen * (1.0 - aStart);
  var axMid   = (axStart + axEnd) * 0.5;
  var aBaseY  = ventPeak - bodyHpx * 0.05;
  var aBotY   = aBaseY + h * aH * 0.75;
  analSVG =
    'M ' + f(axEnd) + ',' + f(aBaseY)
    + ' C ' + f(axMid + (axEnd-axMid)*0.2) + ',' + f(aBotY - h*aH*0.1)
    + ' '   + f(axMid) + ',' + f(aBotY)
    + ' '   + f(axStart) + ',' + f(aBaseY)
    + ' Z';

  // ── 胸鰭 (pectoral) ──
  var pectoralSVG = '';
  var pSize = m.pectoral !== undefined ? m.pectoral : 0.16;
  var pBaseX = xTailBase + bodyLen * 0.72;
  var pBaseY = cy - bodyHpx * 0.05;
  var pLen   = bodyHpx * pSize * 3.5;
  var pSpread = bodyHpx * 0.35;
  pectoralSVG =
    'M ' + f(pBaseX) + ',' + f(pBaseY)
    + ' C ' + f(pBaseX - pLen*0.3) + ',' + f(pBaseY - pSpread*0.4)
    + ' '   + f(pBaseX - pLen*0.7) + ',' + f(pBaseY + pSpread*0.3)
    + ' '   + f(pBaseX - pLen) + ',' + f(pBaseY + pSpread * 0.6)
    + ' C ' + f(pBaseX - pLen*0.65) + ',' + f(pBaseY + pSpread)
    + ' '   + f(pBaseX - pLen*0.3) + ',' + f(pBaseY + pSpread * 0.5)
    + ' '   + f(pBaseX) + ',' + f(pBaseY)
    + ' Z';

  // ── 目 ──
  var eyeR  = Math.max(2.5, bodyHpx * 0.175);
  var eyeX  = xTailBase + bodyLen * 0.82;
  var eyeY  = cy - bodyHpx * 0.22;
  // 吻が長い魚は目を前寄りに
  if (m.snout === 'long') { eyeX += bodyLen * 0.03; }

  // ── SVG組み立て ──
  var svgStr =
    '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '">'
    + '<defs>'
    + '<linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1">'
    + '<stop offset="0%" stop-color="' + backCol + '"/>'
    + '<stop offset="55%" stop-color="' + bodyFill + '"/>'
    + '<stop offset="100%" stop-color="' + bellyCol + '"/>'
    + '</linearGradient>'
    + '<linearGradient id="' + gidFin + '" x1="0" y1="0" x2="0" y2="1">'
    + '<stop offset="0%" stop-color="' + finFill + '" stop-opacity="0.9"/>'
    + '<stop offset="100%" stop-color="' + finFill + '" stop-opacity="0.5"/>'
    + '</linearGradient>'
    + '</defs>';

  // 胸鰭(体の下レイヤ)
  svgStr += '<path d="' + pectoralSVG + '" fill="url(#' + gidFin + ')" stroke="' + strokeColor + '" stroke-width="0.6" opacity="0.8"/>';
  // 臀鰭
  svgStr += '<path d="' + analSVG + '" fill="url(#' + gidFin + ')" stroke="' + strokeColor + '" stroke-width="0.6" opacity="0.8"/>';
  // ボディ
  svgStr += '<path d="' + bodyPath + '" fill="url(#' + gid + ')" stroke="' + strokeColor + '" stroke-width="0.9"/>';
  // 背鰭
  svgStr += '<path d="' + dorsalSVG + '" fill="url(#' + gidFin + ')" stroke="' + strokeColor + '" stroke-width="0.7" opacity="0.9"/>';
  svgStr += spinySVG;

  // 目
  if (!filled) {
    svgStr += '<circle cx="' + f(eyeX) + '" cy="' + f(eyeY) + '" r="' + f(eyeR) + '" fill="' + eyeColor + '"/>'
      + '<circle cx="' + f(eyeX - eyeR*0.28) + '" cy="' + f(eyeY - eyeR*0.28) + '" r="' + f(eyeR*0.28) + '" fill="rgba(255,255,255,0.70)"/>';
  }

  svgStr += '</svg>';
  return svgStr;
}

/* ---------- 星評価ヘルパー ---------- */
function UIStars(n, max) {
  max = max || 5;
  var s = '';
  for (var i = 1; i <= max; i++) {
    s += i <= n ? '★' : '☆';
  }
  return s;
}

/* ---------- 時刻文字列ヘルパー ---------- */
function UITimeString(timeOfDay) {
  // timeOfDay 0..1 → HH:MM 風文字列 (ゲーム内1日)
  var totalMin = Math.floor(timeOfDay * 24 * 60);
  var h = Math.floor(totalMin / 60) % 24;
  var m = totalMin % 60;
  return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
}

function UITimeIcon(timeOfDay) {
  if (timeOfDay < 0.25)  return '🌅'; // 朝
  if (timeOfDay < 0.55)  return '☀️'; // 昼
  if (timeOfDay < 0.75)  return '🌆'; // 夕
  return '🌙';                         // 夜
}
