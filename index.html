  /* ===== イベントバインド ===== */
  _bindEvents() {
    var self = this;

    // タイトル「釣りを始める」
    this._on('ui-start-btn', 'click', function() {
      if (self._game && typeof self._game.startGame === 'function') {
        self._game.startGame();
      }
    });

    // HUDボタン
    this._on('ui-btn-dex',    'click', function() { self.openDex(); });
    this._on('ui-btn-tackle', 'click', function() { self.openTackle(); });
    this._on('ui-btn-menu',   'click', function() { self.openMenu(); });

    // 釣果モーダル閉じる
    this._on('ui-catch-close', 'click', function() {
      if (self._game && typeof self._game.dismissCatch === 'function') {
        self._game.dismissCatch();
      }
      self._dom.catchModal.classList.remove('is-active');
    });

    // 図鑑閉じる
    this._on('ui-dex-close', 'click', function() { self.closeDex(); });
    this._on('ui-dex-detail-close', 'click', function() {
      self._dom.dexDetail.classList.remove('is-active');
    });

    // タックル画面閉じる
    this._on('ui-tackle-close', 'click', function() { self.closeTackle(); });

    // タックルタブ
    var tabs = this._root.querySelectorAll('.ui-tackle__tab');
    for (var i = 0; i < tabs.length; i++) {
      tabs[i].addEventListener('click', function(e) {
        var tab = e.currentTarget.getAttribute('data-tab');
        self._switchTackleTab(tab);
      });
    }

    // メニューボタン
    this._on('ui-menu-resume', 'click', function() {
      self.closeMenu();
      if (self._game && typeof self._game.resume === 'function') {
        self._game.resume();
      }
    });
    this._on('ui-menu-sound', 'click', function() {
      if (self._game && typeof self._game.toggleSound === 'function') {
        self._game.toggleSound();
      }
    });
    this._on('ui-menu-title', 'click', function() {
      self.closeMenu();
      self.openTitle();
    });
  }

  /* ===== ユーティリティ ===== */
  _el(tag, cls, html) {
    var el = document.createElement(tag);
    if (cls) el.className = cls;
    if (html !== undefined) el.innerHTML = html;
    return el;
  }

  _on(id, event, fn) {
    var el = document.getElementById(id);
    if (el) el.addEventListener(event, fn);
  }

  _get(id) {
    return document.getElementById(id);
  }

  /* ===== 公開: bind ===== */
  /**
   * GameCore インスタンスを受け取り連携。
   * @param {object} game GameCore
   */
  bind(game) {
    this._game = game;
  }

  /* ===== 画面: タイトル ===== */
  openTitle() {
    this._dom.title.style.display    = '';
    this._dom.hud.classList.remove('is-active');
    this._dom.dex.classList.remove('is-active');
    this._dom.tackle.classList.remove('is-active');
    this._dom.menu.classList.remove('is-active');
    this._dom.catchModal.classList.remove('is-active');
    this._dom.biteMinor.classList.remove('is-active');
    this._dom.biteMajor.classList.remove('is-active');
    this._biteLevel = 0;
  }

  _hideTitle() {
    this._dom.title.style.display = 'none';
    this._dom.hud.classList.add('is-active');
  }

  /* ===== 公開: setHUD ===== */
  /**
   * 毎フレーム呼ばれる。差分のみ DOM 更新。
   * @param {object} p { state, tension, distance, stamina, coins, time, speciesHint }
   */
  setHUD(p) {
    if (!p) return;

    var cache = this._hudCache;
    var g = this._get.bind(this);

    // ── タイトル非表示 ──
    if (this._dom.title.style.display !== 'none') {
      this._hideTitle();
    }

    /* --- 時刻 --- */
    var timeVal = (p.time !== undefined) ? p.time : 0;
    if (timeVal !== cache.time) {
      cache.time = timeVal;
      var iconEl = g('ui-time-icon');
      var txtEl  = g('ui-time-text');
      if (iconEl) iconEl.textContent = UITimeIcon(timeVal);
      if (txtEl)  txtEl.textContent  = UITimeString(timeVal);
    }

    /* --- コイン --- */
    if (p.coins !== undefined && p.coins !== cache.coins) {
      cache.coins = p.coins;
      var coinEl = g('ui-coin-text');
      if (coinEl) coinEl.textContent = p.coins.toLocaleString();

      // タックル画面が開いている場合は購入ボタンを再評価
      if (this._dom.tackle.classList.contains('is-active')) {
        this._renderTackleList();
      }
    }

    /* --- 状態テキスト --- */
    if (p.state !== undefined && p.state !== cache.state) {
      cache.state = p.state;
      var stEl = g('ui-status-text');
      if (stEl) {
        stEl.textContent  = this._stateLabel(p.state);
        stEl.className    = 'ui-hud__status' + (p.state === 'bite' ? ' is-bite' : '');
      }

      // キャストメーター表示切替
      var castMeter = g('ui-cast-meter');
      if (castMeter) {
        castMeter.classList.toggle('is-active', p.state === 'casting');
      }

      // テンションパネル
      var tensionPanel = g('ui-tension-panel');
      if (tensionPanel) {
        tensionPanel.classList.toggle('is-active', p.state === 'fight');
      }

      // タックル情報更新(equipped)
      this._updateTackleHUD();
    }

    /* --- テンション --- */
    if (p.tension !== undefined && p.tension !== cache.tension) {
      cache.tension = p.tension;
      var tFill = g('ui-tension-fill');
      if (tFill) {
        var pct = Math.min(100, Math.max(0, p.tension * 100));
        tFill.style.height = pct + '%';
        tFill.className = 'ui-hud__tension-fill'
          + (p.tension > 0.8 ? ' is-danger' : p.tension > 0.55 ? ' is-warn' : '');
      }
    }

    /* --- 距離 --- */
    if (p.distance !== undefined && p.distance !== cache.distance) {
      cache.distance = p.distance;
      var distEl = g('ui-fish-dist');
      if (distEl) distEl.textContent = p.distance.toFixed(1);
    }

    /* --- スタミナ --- */
    if (p.stamina !== undefined && p.stamina !== cache.stamina) {
      cache.stamina = p.stamina;
      var sFill = g('ui-stamina-fill');
      if (sFill) {
        sFill.style.width = Math.min(100, Math.max(0, p.stamina * 100)) + '%';
        sFill.style.background = p.stamina > 0.5 ? '#22aa66' : p.stamina > 0.25 ? '#ddaa11' : '#cc3333';
      }
    }
  }

  /* キャストパワーを直接セット (setHUD 経由以外でも呼べる) */
  setCastPower(power) {
    var fill = this._get('ui-cast-fill');
    if (!fill) return;
    var pct = Math.min(100, Math.max(0, power * 100));
    fill.style.width = pct + '%';

    // キャストメーター表示
    var meter = this._get('ui-cast-meter');
    if (meter) meter.classList.add('is-active');
  }

  _stateLabel(state) {
    var map = {
      idle:    '長押しでキャスト',
      casting: 'キャスト中…',
      waiting: 'アタリを待て…',
      bite:    '!! 合わせろ !!',
      fight:   'リールを巻け！',
      landed:  '釣れた！',
      title:   ''
    };
    return map[state] || '';
  }

  _updateTackleHUD() {
    var game = this._game;
    if (!game || !game.equipped) return;
    var eq = game.equipped;
    var rodEl  = this._get('ui-rod-name');
    var baitEl = this._get('ui-bait-name');
    // equipped.rod / bait は文字列ID。TACKLE_* から名前を引く
    if (rodEl && eq.rod) {
      var rodName = '—';
      try {
        for (var ri = 0; ri < TACKLE_RODS.length; ri++) {
          if (TACKLE_RODS[ri].id === eq.rod) { rodName = TACKLE_RODS[ri].name; break; }
        }
      } catch(e) {}
      rodEl.textContent = rodName;
    }
    if (baitEl && eq.bait) {
      var baitName = eq.bait;
      try {
        for (var bi = 0; bi < TACKLE_BAITS.length; bi++) {
          if (TACKLE_BAITS[bi].id === eq.bait) { baitName = TACKLE_BAITS[bi].name; break; }
        }
      } catch(e) {}
      baitEl.textContent = baitName;
    }
  }

  /* ===== 公開: showBite ===== */
  /**
   * @param {number} level 0=なし 1=前アタリ 2=本アタリ
   */
  showBite(level) {
    var self = this;
    this._biteLevel = level;

    var minor = this._dom.biteMinor;
    var major = this._dom.biteMajor;

    if (this._biteTimeout) {
      clearTimeout(this._biteTimeout);
      this._biteTimeout = null;
    }

    if (level === 0) {
      minor.classList.remove('is-active');
      major.classList.remove('is-active');
    } else if (level === 1) {
      minor.classList.add('is-active');
      major.classList.remove('is-active');
    } else if (level >= 2) {
      minor.classList.remove('is-active');
      // 再生のために一旦削除→付与
      major.classList.remove('is-active');
      void major.offsetWidth; // reflow
      major.classList.add('is-active');
      // 本アタリは約 1.2s で自動消去しない(game 側から showBite(0) を呼ぶ想定)
    }
  }

  /* ===== 公開: showCatch ===== */
  /**
   * @param {object} species    SPECIES エントリ
   * @param {number} sizeCm
   * @param {number} weightKg
   * @param {number} coins
   * @param {boolean} isNew     初釣果
   * @param {boolean} isRecord  記録更新
   */
  showCatch(species, sizeCm, weightKg, coins, isNew, isRecord) {
    var modal = this._dom.catchModal;
    var card  = this._get('ui-catch-card');

    // fantasy 枠
    var isFantasy = species && species.category === 'fantasy';
    card.className = 'ui-catch-card' + (isFantasy ? ' is-fantasy' : '');

    // バッジ
    var badges = this._get('ui-catch-badges');
    badges.innerHTML = '';
    if (isNew) {
      var nb = document.createElement('span');
      nb.className = 'ui-catch-badge is-new';
      nb.textContent = 'NEW!';
      badges.appendChild(nb);
    }
    if (isRecord) {
      var rb = document.createElement('span');
      rb.className = 'ui-catch-badge is-record';
      rb.textContent = '記録更新！';
      badges.appendChild(rb);
    }

    // 名前
    this._get('ui-catch-name').textContent    = (species && species.name)   || '不明の魚';
    this._get('ui-catch-name-en').textContent = (species && species.nameEn) || '';

    // SVG
    var svgWrap = this._get('ui-catch-svg');
    svgWrap.innerHTML = species ? UIBuildFishSVG(species, false, 240, 110) : '';

    // スタッツ
    this._get('ui-catch-size').textContent   = sizeCm   ? sizeCm.toFixed(1)   + ' cm' : '—';
    this._get('ui-catch-weight').textContent = weightKg ? weightKg.toFixed(2) + ' kg' : '—';
    this._get('ui-catch-rarity').textContent = species  ? UIStars(species.rarity) : '—';

    // コイン
    this._get('ui-catch-coins').textContent = '獲得 🪙 ' + (coins || 0).toLocaleString();

    modal.classList.add('is-active');

    // アタリ演出を消す
    this.showBite(0);
  }

  /* ===== 公開: openDex / closeDex ===== */
  openDex() {
    this._renderDexGrid();
    this._dom.dex.classList.add('is-active');
  }

  closeDex() {
    this._dom.dex.classList.remove('is-active');
    this._dom.dexDetail.classList.remove('is-active');
  }

  _renderDexGrid() {
    // SPECIES / records は実行時参照
    var speciesList;
    try { speciesList = SPECIES; } catch(e) { speciesList = []; }
    var records;
    try { records = (this._game && this._game.records) ? this._game.records : {}; } catch(e) { records = {}; }

    var grid = this._get('ui-dex-grid');
    if (!grid) return;
    grid.innerHTML = '';

    var caught = 0;
    var total  = speciesList.length;
    var self   = this;

    for (var i = 0; i < speciesList.length; i++) {
      (function(sp) {
        var rec     = records[sp.id];
        var isCaught  = !!(rec && rec.count > 0);
        var isFantasy = sp.category === 'fantasy';
        if (isCaught) caught++;

        var cell = document.createElement('div');
        cell.className = 'ui-dex-cell'
          + (isCaught  ? ' is-caught'  : ' is-unknown')
          + (isFantasy ? ' is-fantasy' : '');

        var svg = UIBuildFishSVG(sp, !isCaught, 64, 44);

        var nameHtml = isCaught
          ? '<div class="ui-dex-cell__name">' + sp.name + '</div>'
          : '<div class="ui-dex-cell__name" style="color:#555">???</div>';

        var countHtml = '';
        if (isCaught && rec) {
          countHtml = '<div class="ui-dex-cell__count">' + rec.count + '匹</div>'
            + '<div class="ui-dex-cell__size">' + rec.maxSize.toFixed(0) + 'cm</div>';
        }

        cell.innerHTML =
          '<div class="ui-dex-cell__silhouette">' + svg + '</div>'
          + nameHtml
          + countHtml;

        cell.addEventListener('click', function() {
          self._showDexDetail(sp, isCaught, records[sp.id]);
        });

        grid.appendChild(cell);
      })(speciesList[i]);
    }

    var prog = this._get('ui-dex-progress');
    if (prog) prog.textContent = caught + '/' + total + '種';
  }

  _showDexDetail(sp, isCaught, rec) {
    var isFantasy = sp.category === 'fantasy';

    this._get('ui-dex-detail-name').textContent    = sp.name   || '???';
    this._get('ui-dex-detail-name-en').textContent = isCaught  ? (sp.nameEn || '') : '???';

    var svgWrap = this._get('ui-dex-detail-svg');
    svgWrap.innerHTML = UIBuildFishSVG(sp, !isCaught, 200, 100);

    this._get('ui-dex-detail-rarity').textContent = 'レア度 ' + (isCaught ? UIStars(sp.rarity) : '★?????');

    // 生息情報
    var meta = '';
    if (isCaught) {
      var habitatMap = { bottom:'底層', mid:'中層', surface:'表層' };
      var activeMap  = { day:'昼',     dusk:'夕',   night:'夜' };
      var habitats  = sp.habitat ? sp.habitat.map(function(h){ return habitatMap[h]||h; }).join('・') : '—';
      var actives   = sp.active  ? sp.active.map(function(a){  return activeMap[a]||a;  }).join('・') : '—';
      meta = '棚: ' + habitats + '　時間帯: ' + actives
           + '\n体長: ' + sp.minSize + '〜' + sp.maxSize + ' cm';
    } else {
      meta = '— 未捕獲 —';
    }
    this._get('ui-dex-detail-meta').textContent = meta;
    this._get('ui-dex-detail-desc').textContent = isCaught ? (sp.desc || '') : '詳細は捕獲後に解禁';

    var recordEl = this._get('ui-dex-detail-record');
    if (rec && rec.count > 0) {
      recordEl.textContent = '捕獲数: ' + rec.count + '匹  最大: ' + rec.maxSize.toFixed(1) + ' cm';
    } else {
      recordEl.textContent = '';
    }

    // fantasy 枠
    var card = this._dom.dexDetail.querySelector('.ui-dex-detail__card');
    if (card) {
      card.style.borderColor = isFantasy ? 'rgba(160,60,220,0.6)' : '';
      card.style.boxShadow   = isFantasy ? '0 0 20px rgba(160,60,220,0.3)' : '';
    }

    this._dom.dexDetail.classList.add('is-active');
  }

  /* ===== 公開: openTackle / closeTackle ===== */
  openTackle() {
    this._switchTackleTab(this._tackleTab);
    this._dom.tackle.classList.add('is-active');
  }

  closeTackle() {
    this._dom.tackle.classList.remove('is-active');
  }

  _switchTackleTab(tab) {
    this._tackleTab = tab;

    // タブ active 切替
    var tabs = this._root.querySelectorAll('.ui-tackle__tab');
    for (var i = 0; i < tabs.length; i++) {
      tabs[i].classList.toggle('is-active', tabs[i].getAttribute('data-tab') === tab);
    }

    this._renderTackleList();
  }

  _renderTackleList() {
    var list = this._get('ui-tackle-list');
    if (!list) return;
    list.innerHTML = '';

    var tab  = this._tackleTab;
    var game = this._game;
    var coins = (game && game.coins !== undefined) ? game.coins : 0;
    var equipped = (game && game.equipped) ? game.equipped : {};
    var owned    = (game && game.owned)    ? game.owned    : {};

    var items    = [];
    var catKey   = ''; // equipped のキー
    var ownedArr = [];
    var statKeys = [];

    try {
      if (tab === 'rod') {
        items    = TACKLE_RODS;
        catKey   = 'rod';
        ownedArr = owned.rods   || [];
        statKeys = [{ key:'power',   label:'パワー'   }, { key:'control', label:'コントロール' }];
      } else if (tab === 'reel') {
        items    = TACKLE_REELS;
        catKey   = 'reel';
        ownedArr = owned.reels  || [];
        statKeys = [{ key:'drag',    label:'ドラグ'   }, { key:'speed',   label:'スピード' }];
      } else if (tab === 'rig') {
        items    = TACKLE_RIGS;
        catKey   = 'rig';
        ownedArr = owned.rigs   || [];
        statKeys = [{ key:'hookSize', label:'鈎サイズ' }];
      } else if (tab === 'bait') {
        items    = TACKLE_BAITS;
        catKey   = 'bait';
        ownedArr = []; // エサは消耗品・常時購入可
        statKeys = [];
      }
    } catch(e) {
      items = [];
    }

    var self = this;

    for (var i = 0; i < items.length; i++) {
      (function(item) {
        // equipped[catKey] は文字列ID、owned配列も文字列ID配列
        var isEquipped = equipped[catKey] === item.id;
        var isOwned    = tab === 'bait' ? true : ownedArr.some(function(o){ return o === item.id; });

        var el = document.createElement('div');
        el.className = 'ui-tackle__item' + (isEquipped ? ' is-equipped' : '');

        // 性能★
        var statsHtml = '';
        for (var k = 0; k < statKeys.length; k++) {
          var sk = statKeys[k];
          statsHtml += '<span class="ui-tackle__stat">'
            + sk.label + ': <span class="ui-tackle__stat-stars">'
            + UIStars(item[sk.key] || 0) + '</span></span>';
        }
        if (tab === 'rig' && item.type) {
          statsHtml += '<span class="ui-tackle__stat">種別: ' + item.type + '</span>';
        }

        // アクションボタン
        var actionHtml = '';
        if (isEquipped) {
          actionHtml = '<span class="ui-tackle__equipped-badge">装備中</span>';
        } else if (isOwned) {
          actionHtml = '<button class="ui-tackle__action-btn is-equip" data-cat="' + catKey + '" data-id="' + item.id + '">装備する</button>';
        } else {
          var canBuy  = coins >= (item.price || 0);
          actionHtml = '<span class="ui-tackle__price">🪙' + (item.price || 0) + '</span>'
            + '<button class="ui-tackle__action-btn is-buy" data-cat="' + catKey + '" data-id="' + item.id + '"'
            + (canBuy ? '' : ' disabled') + '>購入</button>';
        }

        el.innerHTML =
          '<div class="ui-tackle__item-info">'
          + '<div class="ui-tackle__item-name">' + (item.name || item.id) + '</div>'
          + '<div class="ui-tackle__item-desc">'  + (item.desc || '') + '</div>'
          + (statsHtml ? '<div class="ui-tackle__item-stats">' + statsHtml + '</div>' : '')
          + '</div>'
          + actionHtml;

        // ボタンクリック
        var btn = el.querySelector('.ui-tackle__action-btn');
        if (btn) {
          btn.addEventListener('click', function(e) {
            var cat = e.currentTarget.getAttribute('data-cat');
            var id  = e.currentTarget.getAttribute('data-id');
            var isBuyBtn = e.currentTarget.classList.contains('is-buy');

            if (!game) return;

            if (isBuyBtn && typeof game.buy === 'function') {
              var ok = game.buy(cat, id);
              if (ok !== false) { self._renderTackleList(); }
            } else if (!isBuyBtn && typeof game.equip === 'function') {
              game.equip(cat, id);
              self._renderTackleList();
            }
          });
        }

        list.appendChild(el);
      })(items[i]);
    }
  }

  /* ===== 公開: openMenu / closeMenu ===== */
  openMenu() {
    this._dom.menu.classList.add('is-active');
  }

  closeMenu() {
    this._dom.menu.classList.remove('is-active');
  }
}


//============== 06_main.js ==============
// 06_main.js — 起動・カメラ・竿モデル・メインループ
// トップレベル宣言: App* のみ
// import/export 禁止。THREE はスコープにある前提。

(function() {
  /* ============================================================
     レンダラ・シーン・カメラ
     ============================================================ */
  var AppRenderer = new THREE.WebGLRenderer({ antialias: true });
  AppRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  AppRenderer.setSize(window.innerWidth, window.innerHeight);
  AppRenderer.toneMapping = THREE.ACESFilmicToneMapping;
  AppRenderer.toneMappingExposure = 1.0;
  AppRenderer.outputColorSpace = THREE.SRGBColorSpace;
  AppRenderer.shadowMap.enabled = true;
  AppRenderer.shadowMap.type    = THREE.PCFSoftShadowMap;
  document.body.appendChild(AppRenderer.domElement);

  var AppScene  = new THREE.Scene();
  var AppCamera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);

  /* ============================================================
     環境生成
     ============================================================ */
  var AppEnv = EnvCreate(AppScene, AppRenderer);
  var AppStandY = (AppEnv && AppEnv.standY !== undefined) ? AppEnv.standY : 0;
  AppCamera.position.set(0, AppStandY + 1.6, 2);
  AppCamera.lookAt(0, AppStandY + 1.2, -20);

  /* ============================================================
     UI & GameCore
     ============================================================ */
  var AppUI   = new UIController(document.getElementById('ui-root'));
  var AppGame = new GameCore(AppEnv, AppUI);
  AppUI.bind(AppGame);

  // デバッグ用グローバルフック (QA自動化用)
  window.__game = AppGame;
  window.__env  = AppEnv;

  // floatObj をシーンに追加
  if (AppGame.floatObj) AppScene.add(AppGame.floatObj);

  // タイトル画面を開く
  AppUI.openTitle();

  /* ============================================================
     視点操作 (ヨー±60° ピッチ±30°)
     ============================================================ */
  var AppYaw   = 0;
  var AppPitch = -5 * Math.PI / 180; // わずかに下向き
  var AppYawV  = 0;   // 慣性
  var AppPitchV = 0;

  var _dragActive = false;
  var _dragLastX  = 0;
  var _dragLastY  = 0;

  var _touchActive = false;
  var _touchLastX  = 0;
  var _touchLastY  = 0;

  function _isUITarget(e) {
    // canvas 上のみゲーム入力 → UIパネル/ボタンは除外
    return e.target !== AppRenderer.domElement;
  }

  AppRenderer.domElement.addEventListener('pointerdown', function(e) {
    _dragActive = true;
    _dragLastX  = e.clientX;
    _dragLastY  = e.clientY;
    AppGame.pressStart();
  });

  window.addEventListener('pointerup', function(e) {
    if (_dragActive) {
      _dragActive = false;
      AppGame.pressEnd();
    }
  });

  window.addEventListener('pointermove', function(e) {
    if (!_dragActive) return;
    var dx = e.clientX - _dragLastX;
    var dy = e.clientY - _dragLastY;
    _dragLastX = e.clientX;
    _dragLastY = e.clientY;
    AppYawV   += dx * 0.003;
    AppPitchV += dy * 0.002;
  });

  // タッチ
  AppRenderer.domElement.addEventListener('touchstart', function(e) {
    if (e.touches.length > 0) {
      _touchActive = true;
      _touchLastX  = e.touches[0].clientX;
      _touchLastY  = e.touches[0].clientY;
    }
  }, { passive: true });

  window.addEventListener('touchend', function(e) {
    _touchActive = false;
  }, { passive: true });

  window.addEventListener('touchmove', function(e) {
    if (!_touchActive || e.touches.length === 0) return;
    var dx = e.touches[0].clientX - _touchLastX;
    var dy = e.touches[0].clientY - _touchLastY;
    _touchLastX = e.touches[0].clientX;
    _touchLastY = e.touches[0].clientY;
    AppYawV   += dx * 0.003;
    AppPitchV += dy * 0.002;
  }, { passive: true });

  /* ============================================================
     小魚の群れ (水面下 5匹)
     ============================================================ */
  var AppSchoolFish   = [];
  var AppSchoolAngles = [];
  var _schoolSpecies  = (function() {
    // アジかイワシを探す
    for (var i = 0; i < SPECIES.length; i++) {
      if (SPECIES[i].id === 'aji' || SPECIES[i].id === 'iwashi') return SPECIES[i];
    }
    return SPECIES[0];
  })();

  for (var _si = 0; _si < 5; _si++) {
    var _sfMesh = FishCreateMesh(_schoolSpecies, 12);
    _sfMesh.scale.setScalar(0.5);
    AppSchoolAngles.push((_si / 5) * Math.PI * 2);
    AppSchoolFish.push(_sfMesh);
    AppScene.add(_sfMesh);
  }

  /* ============================================================
     竿 (一人称、カメラ追従) — 磯竿テーパー設計
     ============================================================ */
  var AppRodGroup = new THREE.Group(); // カメラに追従させる別オブジェクト

  // ブランク材質: 艶のある濃茶〜黒 clearcoat高め
  var _rodMat = new THREE.MeshPhysicalMaterial({
    color: 0x1a0e06,
    roughness: 0.25,
    metalness: 0.05,
    clearcoat: 0.85,
    clearcoatRoughness: 0.12
  });

  // コルク/EVAグリップ材質 (手元 30cm 程度)
  var _gripMat = new THREE.MeshStandardMaterial({
    color: 0x8b6450,
    roughness: 0.88,
    metalness: 0.0
  });

  // リールシート材質: ガンメタ
  var _reelSeatMat = new THREE.MeshStandardMaterial({
    color: 0x3a3a3a,
    roughness: 0.4,
    metalness: 0.6
  });

  // リールボディ/ローター材質: アルミシルバー
  var _reelBodyMat = new THREE.MeshPhysicalMaterial({
    color: 0xb8c0c8,
    roughness: 0.25,
    metalness: 0.85,
    clearcoat: 0.4,
    clearcoatRoughness: 0.15
  });

  // スプール (糸巻き面): 少し暗めのシルバー
  var _spoolMat = new THREE.MeshStandardMaterial({
    color: 0x9aa0a8,
    roughness: 0.35,
    metalness: 0.75
  });

  // ベール/ガイド: 金属リング
  var _metalMat = new THREE.MeshStandardMaterial({
    color: 0xd0d8e0,
    roughness: 0.15,
    metalness: 0.92
  });

  // 穂先白塗り
  var _tipMat = new THREE.MeshStandardMaterial({
    color: 0xf0f0ee,
    roughness: 0.6,
    metalness: 0.0
  });

  // ハンドルノブ
  var _knobMat = new THREE.MeshStandardMaterial({
    color: 0x222222,
    roughness: 0.55,
    metalness: 0.1
  });

  // 竿を構成する頂点 (CatmullRom制御点) — ローカル座標
  // 竿根元(画面右下) → 竿先へ向かう
  var _rodCtrlPts = [
    new THREE.Vector3( 0.22, -0.28, -0.18),
    new THREE.Vector3( 0.18, -0.12, -0.55),
    new THREE.Vector3( 0.12,  0.04, -0.95),
    new THREE.Vector3( 0.05,  0.18, -1.40),
    new THREE.Vector3(-0.02,  0.28, -1.85),
    new THREE.Vector3(-0.06,  0.34, -2.30)
  ];
  var _rodCurve    = new THREE.CatmullRomCurve3(_rodCtrlPts);
  var _rodSegments = 24;

  // テーパー付き TubeGeometry — 制御点ごとに半径を変える
  // THREE.TubeGeometry は単一半径のみなので、複数セグメントを結合
  function _buildTaperedRod(curve, segs, radBase, radTip) {
    // セグメントを分割して各部分の半径を線形補間
    var positions = [];
    var normals   = [];
    var uvs       = [];
    var indices   = [];
    var radialSegs = 8;

    var points    = curve.getPoints(segs);
    var frames    = curve.computeFrenetFrames(segs, false);

    for (var i = 0; i <= segs; i++) {
      var t      = i / segs;
      // テーパー: 穂先ほど細く (二乗カーブで自然な絞り)
      var radius = radBase + (radTip - radBase) * (t * t);
      var pt     = points[i];
      var N      = frames.normals[i];
      var B      = frames.binormals[i];

      for (var j = 0; j <= radialSegs; j++) {
        var phi = (j / radialSegs) * Math.PI * 2;
        var cos = Math.cos(phi);
        var sin = Math.sin(phi);
        var nx  = cos * N.x + sin * B.x;
        var ny  = cos * N.y + sin * B.y;
        var nz  = cos * N.z + sin * B.z;
        positions.push(pt.x + nx * radius, pt.y + ny * radius, pt.z + nz * radius);
        normals.push(nx, ny, nz);
        uvs.push(j / radialSegs, t);
      }
    }

    for (var i = 0; i < segs; i++) {
      for (var j = 0; j < radialSegs; j++) {
        var a = i * (radialSegs + 1) + j;
        var b = a + radialSegs + 1;
        indices.push(a, b, a + 1);
        indices.push(b, b + 1, a + 1);
      }
    }

    var geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(positions), 3));
    geo.setAttribute('normal',   new THREE.BufferAttribute(new Float32Array(normals), 3));
    geo.setAttribute('uv',       new THREE.BufferAttribute(new Float32Array(uvs), 2));
    geo.setIndex(new THREE.BufferAttribute(new Uint16Array(indices), 1));
    return geo;
  }

  // 竿ブランク本体 (根元r=0.010, 穂先r=0.0025)
  var _rodGeo  = _buildTaperedRod(_rodCurve, _rodSegments, 0.010, 0.0025);
  var _rodMesh = new THREE.Mesh(_rodGeo, _rodMat);
  AppRodGroup.add(_rodMesh);

  // コルク/EVAグリップ: 根元〜20cm 程度を太く柔らかく
  // CatmullRom で根元だけの短い曲線
  var _gripCurve = new THREE.CatmullRomCurve3([
    _rodCtrlPts[0].clone(),
    _rodCtrlPts[0].clone().lerp(_rodCtrlPts[1], 0.35)
  ]);
  var _gripGeo   = _buildTaperedRod(_gripCurve, 6, 0.016, 0.013);
  var _gripMesh  = new THREE.Mesh(_gripGeo, _gripMat);
  AppRodGroup.add(_gripMesh);

  // リールシート (グリップ前方): 短いシリンダー状
  var _reelSeatPt  = _rodCtrlPts[0].clone().lerp(_rodCtrlPts[1], 0.35);
  var _reelSeatPt2 = _rodCtrlPts[0].clone().lerp(_rodCtrlPts[1], 0.55);
  var _seatCurve   = new THREE.CatmullRomCurve3([_reelSeatPt, _reelSeatPt2]);
  var _seatGeo     = _buildTaperedRod(_seatCurve, 4, 0.014, 0.012);
  var _seatMesh    = new THREE.Mesh(_seatGeo, _reelSeatMat);
  AppRodGroup.add(_seatMesh);

  // 穂先だけ白塗り (t=0.85〜1.0 の短いセグメント)
  var _tipStartPt = _rodCurve.getPoint(0.85);
  var _tipEndPt   = _rodCurve.getPoint(1.0);
  var _tipCurve   = new THREE.CatmullRomCurve3([
    _tipStartPt,
    _rodCurve.getPoint(0.92),
    _tipEndPt
  ]);
  var _tipGeo  = _buildTaperedRod(_tipCurve, 8, 0.0022, 0.0012);
  var _tipMesh = new THREE.Mesh(_tipGeo, _tipMat);
  AppRodGroup.add(_tipMesh);

  /* ---- スピニングリール (ボディ+ローター+スプール+ベール+ハンドル) ---- */
  var _reelGroup = new THREE.Group();
  // リール取り付け位置: グリップ直前
  var _reelAttachPt = _rodCtrlPts[0].clone().lerp(_rodCtrlPts[1], 0.48);
  _reelGroup.position.copy(_reelAttachPt);
  // リールシート方向に回転
  var _seatTan = _rodCurve.getTangent(0.06);
  _reelGroup.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), _seatTan.normalize());

  // ボディ (扁平な楕円形状)
  var _bodyGeo = new THREE.CylinderGeometry(0.020, 0.018, 0.030, 16);
  var _bodyMesh = new THREE.Mesh(_bodyGeo, _reelBodyMat);
  _bodyMesh.rotation.z = Math.PI / 2;
  _bodyMesh.position.set(-0.025, 0, 0);
  _reelGroup.add(_bodyMesh);

  // ローター (フット側: 薄いディスク)
  var _rotorGeo  = new THREE.CylinderGeometry(0.022, 0.022, 0.008, 16);
  var _rotorMesh = new THREE.Mesh(_rotorGeo, _reelBodyMat);
  _rotorMesh.rotation.z = Math.PI / 2;
  _rotorMesh.position.set(-0.006, 0, 0);
  _reelGroup.add(_rotorMesh);

  // スプール (糸巻き面: フランジ付き)
  var _spoolGeo  = new THREE.CylinderGeometry(0.018, 0.018, 0.018, 14);
  var _spoolMesh = new THREE.Mesh(_spoolGeo, _spoolMat);
  _spoolMesh.rotation.z = Math.PI / 2;
  _spoolMesh.position.set(0.012, 0, 0);
  _reelGroup.add(_spoolMesh);
  // スプールフランジ前後
  var _flangeGeo = new THREE.CylinderGeometry(0.023, 0.023, 0.004, 14);
  var _flangeF   = new THREE.Mesh(_flangeGeo, _spoolMat);
  _flangeF.rotation.z = Math.PI / 2;
  _flangeF.position.set(0.021, 0, 0);
  _reelGroup.add(_flangeF);
  var _flangeB   = new THREE.Mesh(_flangeGeo, _spoolMat);
  _flangeB.rotation.z = Math.PI / 2;
  _flangeB.position.set(0.002, 0, 0);
  _reelGroup.add(_flangeB);

  // ベール (細い金属アーチ): TorusGeometry の一部
  var _bailGeo  = new THREE.TorusGeometry(0.024, 0.0018, 6, 20, Math.PI);
  var _bailMesh = new THREE.Mesh(_bailGeo, _metalMat);
  _bailMesh.rotation.y = Math.PI / 2;
  _bailMesh.position.set(-0.002, 0.0, 0);
  _reelGroup.add(_bailMesh);

  // ハンドルアーム
  var _armGeo  = new THREE.CylinderGeometry(0.003, 0.003, 0.038, 8);
  var _armMesh = new THREE.Mesh(_armGeo, _metalMat);
  _armMesh.rotation.x = Math.PI / 2;
  _armMesh.position.set(-0.025, 0.019, 0.0);
  _reelGroup.add(_armMesh);

  // ハンドルノブ
  var _knobGeo  = new THREE.CylinderGeometry(0.007, 0.006, 0.014, 8);
  var _knobMesh = new THREE.Mesh(_knobGeo, _knobMat);
  _knobMesh.rotation.x = Math.PI / 2;
  _knobMesh.position.set(-0.025, 0.038, 0.0);
  _reelGroup.add(_knobMesh);

  AppRodGroup.add(_reelGroup);

  // ガイドリング (6個) — 小さな金属リング+足
  var _guideMat  = new THREE.MeshStandardMaterial({ color: 0xd0d8e0, metalness: 0.92, roughness: 0.12 });
  var _guideRing = [];
  // t=0.10〜0.92 に6個配置 (先端ほど小さく)
  var _guideT    = [0.10, 0.25, 0.42, 0.58, 0.74, 0.88];
  var _guideRadii = [0.010, 0.009, 0.008, 0.007, 0.006, 0.005]; // リング半径
  for (var _gi = 0; _gi < _guideT.length; _gi++) {
    var _gpt  = _rodCurve.getPoint(_guideT[_gi]);
    var _gTan = _rodCurve.getTangent(_guideT[_gi]);
    var _gGrp = new THREE.Group();
    _gGrp.position.copy(_gpt);
    _gGrp.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), _gTan.normalize());

    // リング本体 (竿方向に向いたトーラス)
    var _gRingGeo  = new THREE.TorusGeometry(_guideRadii[_gi], 0.0015, 5, 12);
    var _gRingMesh = new THREE.Mesh(_gRingGeo, _guideMat);
    _gGrp.add(_gRingMesh);

    // 足 (竿に沿った小さなシリンダー)
    var _footGeo  = new THREE.CylinderGeometry(0.001, 0.001, _guideRadii[_gi] * 1.6, 5);
    var _footMesh = new THREE.Mesh(_footGeo, _guideMat);
    _footMesh.position.set(0, _guideRadii[_gi] * 0.8, 0.001);
    _gGrp.add(_footMesh);

    AppRodGroup.add(_gGrp);
    _guideRing.push(_gGrp);
  }

  AppScene.add(AppRodGroup);

  /* ============================================================
     ライン (竿先→ウキ QuadraticBezier) — 細く半透明グレー
     ============================================================ */
  var _linePts   = [];
  var _lineDivs  = 20;
  for (var _li = 0; _li <= _lineDivs; _li++) _linePts.push(new THREE.Vector3());

  var _lineGeo = new THREE.BufferGeometry();
  var _linePos = new Float32Array((_lineDivs + 1) * 3);
  _lineGeo.setAttribute('position', new THREE.BufferAttribute(_linePos, 3));

  // 細く見せるため: 薄いグレー + 半透明
  var _lineMat  = new THREE.LineBasicMaterial({
    color: 0xa0a8a0,
    transparent: true,
    opacity: 0.45,
    linewidth: 1
  });
  var _lineMesh = new THREE.Line(_lineGeo, _lineMat);
  AppScene.add(_lineMesh);

  // 竿先ワールド座標を取得するための一時ベクタ
  var _rodTipLocal = new THREE.Vector3();
  var _rodTipWorld = new THREE.Vector3();

  /* ============================================================
     ファイト中の魚メッシュ
     ============================================================ */
  var AppHookedMesh = null;

  /* ============================================================
     ランディング演出
     ============================================================ */
  var _landingMesh     = null;
  var _landingTimer    = 0;
  var _landingDuration = 3.0;
  var _landingDone     = false;
  var _landingLight    = null; // 魚用フィルライト

  /* ============================================================
     タイトルパン
     ============================================================ */
  var _titlePanT = 0;

  /* ============================================================
     リサイズ
     ============================================================ */
  window.addEventListener('resize', function() {
    AppCamera.aspect = window.innerWidth / window.innerHeight;
    AppCamera.updateProjectionMatrix();
    AppRenderer.setSize(window.innerWidth, window.innerHeight);
  });

  /* ============================================================
     竿ジオメトリ更新 (テーパー付き再構築)
     ============================================================ */
  function AppUpdateRod(tension) {
    // テンションに応じて穂先側を曲げる (穂先ほど大きく曲がる自然な曲率)
    var bend = tension * 0.30;
    // 制御点3〜5を穂先方向に移動 (先端ほど大きく)
    _rodCtrlPts[3].y = 0.18  + bend * 0.25;
    _rodCtrlPts[4].y = 0.28  + bend * 0.55;
    _rodCtrlPts[5].y = 0.34  + bend;
    _rodCtrlPts[5].z = -2.30 + bend * 0.35;
    _rodCurve.points = _rodCtrlPts;

    // テーパー付き Tube を再構築
    _rodGeo.dispose();
    _rodGeo = _buildTaperedRod(_rodCurve, _rodSegments, 0.010, 0.0025);
    _rodMesh.geometry = _rodGeo;

    // 穂先ジオメトリ更新
    _tipGeo.dispose();
    var _newTipStartPt = _rodCurve.getPoint(0.85);
    var _newTipCurve   = new THREE.CatmullRomCurve3([
      _newTipStartPt,
      _rodCurve.getPoint(0.92),
      _rodCurve.getPoint(1.0)
    ]);
    _tipGeo = _buildTaperedRod(_newTipCurve, 8, 0.0022, 0.0012);
    _tipMesh.geometry = _tipGeo;

    // ガイドリングの位置更新
    for (var i = 0; i < _guideRing.length; i++) {
      var pt  = _rodCurve.getPoint(_guideT[i]);
      var tan = _rodCurve.getTangent(_guideT[i]);
      _guideRing[i].position.copy(pt);
      _guideRing[i].quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), tan.normalize());
    }
  }

  /* ============================================================
     ライン更新
     ============================================================ */
  function AppUpdateLine(tension) {
    // 竿先ワールド座標
    _rodTipLocal.copy(_rodCtrlPts[5]);
    AppRodGroup.localToWorld(_rodTipWorld.copy(_rodTipLocal));

    var floatPos = AppGame.floatObj && AppGame.floatObj.visible
      ? AppGame.floatObj.position
      : new THREE.Vector3(_rodTipWorld.x, _rodTipWorld.y - 2, _rodTipWorld.z - 10);

    // 中間制御点: たるみはテンションで減る (tension=0で大きくたるむ)
    var sageFactor = 1.0 - tension * 0.85;
    var midX = (_rodTipWorld.x + floatPos.x) * 0.5;
    var midY = Math.min(_rodTipWorld.y, floatPos.y) - sageFactor * 1.5;
    var midZ = (_rodTipWorld.z + floatPos.z) * 0.5;

    var ctrl0 = _rodTipWorld;
    var ctrl1 = new THREE.Vector3(midX, midY, midZ);
    var ctrl2 = floatPos;

    var posArr = _lineGeo.attributes.position.array;
    for (var i = 0; i <= _lineDivs; i++) {
      var tl = i / _lineDivs;
      var inv = 1 - tl;
      var px = inv * inv * ctrl0.x + 2 * inv * tl * ctrl1.x + tl * tl * ctrl2.x;
      var py = inv * inv * ctrl0.y + 2 * inv * tl * ctrl1.y + tl * tl * ctrl2.y;
      var pz = inv * inv * ctrl0.z + 2 * inv * tl * ctrl1.z + tl * tl * ctrl2.z;
      posArr[i * 3]     = px;
      posArr[i * 3 + 1] = py;
      posArr[i * 3 + 2] = pz;
    }
    _lineGeo.attributes.position.needsUpdate = true;
  }

  /* ============================================================
     ファイト中の魚影
     ============================================================ */
  function AppUpdateHookedFish(t) {
    var game = AppGame;
    if (game.state === 'fight' && game.hookedFish) {
      if (!AppHookedMesh) {
        AppHookedMesh = FishCreateMesh(game.hookedFish.species, game.hookedFish.sizeCm);
        AppScene.add(AppHookedMesh);
      }
      // ウキ位置付近を水面下で泳ぎ回る
      var fo  = game.floatObj;
      var fop = fo ? fo.position : new THREE.Vector3(0, 0, -15);
      var ang = t * 0.8;
      var rad = Math.min(game.fishDistance * 0.3, 4);
      AppHookedMesh.position.set(
        fop.x + Math.cos(ang) * rad,
        (AppEnv ? AppEnv.standY : 0) - 1.0 - game.fishDistance * 0.05,
        fop.z + Math.sin(ang) * rad
      );
      AppHookedMesh.rotation.y = ang + Math.PI;

      // ファイト中: ローター回転 (リールグループのローターを回す)
      if (_rotorMesh) {
        _rotorMesh.rotation.x += 0.03;
      }
    } else if (game.state !== 'fight' && game.state !== 'landed') {
      if (AppHookedMesh) {
        FishDispose(AppHookedMesh);
        AppScene.remove(AppHookedMesh);
        AppHookedMesh = null;
      }
    }
  }

  /* ============================================================
     ランディング演出 — 魚をカメラ前に掲げる
     ============================================================ */
  function AppHandleLanding(dt) {
    var game = AppGame;
    if (game.state === 'landed') {
      if (!_landingMesh && game.hookedFish) {
        // AppHookedMeshがなければここで生成 (fight経由せずlanded注入された場合等)
        if (!AppHookedMesh) {
          AppHookedMesh = FishCreateMesh(game.hookedFish.species, game.hookedFish.sizeCm);
          AppScene.add(AppHookedMesh);
        }
        // 魚をカメラ前に掲げる
        _landingMesh  = AppHookedMesh;
        AppHookedMesh = null;
        _landingTimer = 0;
        _landingDone  = false;

        // フィルライト追加 (魚を照らす薄い暖色ライト)
        if (!_landingLight) {
          _landingLight = new THREE.PointLight(0xffd080, 1.8, 2.5);
          AppScene.add(_landingLight);
        }
      }
      if (_landingMesh) {
        _landingTimer += dt;

        // カメラ正面 0.6m・やや下に配置
        var fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(AppCamera.quaternion);
        var targetPos = AppCamera.position.clone().addScaledVector(fwd, 0.6);
        targetPos.y -= 0.10; // やや下

        // サイズ調整: 大物でも画面に収まるようスケール制限
        // 魚はsizeCm/100 m の実寸。カメラ前0.6mでFOV60° → 画面高≒0.69m
        // 目標: 魚が画面高の約40%以内に収まるよう = 最大0.28m表示
        if (game.hookedFish) {
          var sizeCm = game.hookedFish.sizeCm;
          var fishLenM = sizeCm / 100;
          // 0.28m以内に制限
          var targetScale = Math.min(1.0, 0.28 / Math.max(fishLenM, 0.10));
          _landingMesh.scale.setScalar(targetScale);
        }

        _landingMesh.position.copy(targetPos);
        // 軽く回転して見せる (ゆっくり1回転)
        var rotAngle = _landingTimer * 1.2;
        _landingMesh.rotation.y = AppCamera.rotation.y + Math.sin(rotAngle) * 0.5;
        _landingMesh.rotation.x = Math.sin(_landingTimer * 0.8) * 0.12;

        // フィルライトを魚のやや斜め上に配置
        if (_landingLight) {
          _landingLight.position.copy(targetPos).addScaledVector(fwd, -0.1);
          _landingLight.position.y += 0.3;
          _landingLight.position.x += 0.2;
          // 演出終盤で徐々にフェードアウト
          if (_landingTimer > _landingDuration * 0.7) {
            var fadeRatio = 1.0 - (_landingTimer - _landingDuration * 0.7) / (_landingDuration * 0.3);
            _landingLight.intensity = Math.max(0, 1.8 * fadeRatio);
          }
        }

        if (_landingTimer > _landingDuration && !_landingDone) {
          _landingDone = true;
        }
      }
    } else {
      // idle などに戻ったらランディングメッシュを片付け
      if (_landingMesh) {
        FishDispose(_landingMesh);
        AppScene.remove(_landingMesh);
        _landingMesh  = null;
        _landingTimer = 0;
        _landingDone  = false;
      }
      // フィルライトも消す
      if (_landingLight) {
        AppScene.remove(_landingLight);
        _landingLight.dispose ? _landingLight.dispose() : null;
        _landingLight = null;
      }
    }
  }

  /* ============================================================
     カメラ更新
     ============================================================ */
  function AppUpdateCamera(dt) {
    var game = AppGame;
    var inertia = 0.88;

    if (game.state === 'title') {
      // 海と灯台が映える画角: やや右方向にパン、水平線と灯台を捉える
      _titlePanT += dt * 0.10;
      // 灯台が通常シーンの右前方にある想定でヨーを-0.15〜+0.25に振る
      AppYaw   = -0.10 + Math.sin(_titlePanT) * 0.22;
      AppPitch = -0.08; // 水平線がやや上方: 海面が広く見える
      AppYawV  = 0;
      AppPitchV = 0;
    } else {
      // 慣性
      AppYawV   *= inertia;
      AppPitchV *= inertia;
      AppYaw    += AppYawV;
      AppPitch  += AppPitchV;
    }

    // クランプ
    var maxYaw   =  60 * Math.PI / 180;
    var minPitch = -30 * Math.PI / 180;
    var maxPitch =  30 * Math.PI / 180;
    AppYaw   = Math.max(-maxYaw,   Math.min(maxYaw,   AppYaw));
    AppPitch = Math.max(minPitch,  Math.min(maxPitch, AppPitch));

    AppCamera.position.set(0, AppStandY + 1.6, 2);
    AppCamera.rotation.order = 'YXZ';
    AppCamera.rotation.y = AppYaw;
    AppCamera.rotation.x = AppPitch;

    // 竿グループをカメラに追従
    AppRodGroup.position.copy(AppCamera.position);
    AppRodGroup.rotation.copy(AppCamera.rotation);
  }

  /* ============================================================
     小魚群れ更新
     ============================================================ */
  function AppUpdateSchool(t) {
    for (var i = 0; i < AppSchoolFish.length; i++) {
      AppSchoolAngles[i] += 0.008;
      var ang = AppSchoolAngles[i];
      var rad = 5 + i * 1.2;
      AppSchoolFish[i].position.set(
        Math.cos(ang) * rad,
        (AppEnv ? AppEnv.standY : 0) - 0.6 - i * 0.3,
        Math.sin(ang) * rad - 15
      );
      AppSchoolFish[i].rotation.y = -ang + Math.PI / 2;
    }
  }

  /* ============================================================
     メインループ
     ============================================================ */
  var _prevTime = performance.now() * 0.001;

  function AppAnimate() {
    requestAnimationFrame(AppAnimate);
    var now = performance.now() * 0.001;
    var dt  = Math.min(now - _prevTime, 0.1);
    _prevTime = now;

    var t = now; // 経過秒

    // 環境更新
    if (AppEnv && AppEnv.update) AppEnv.update(t, dt);

    // ゲーム更新
    AppGame.update(t, dt);

    // 魚アニメ
    FishUpdateAll(t);

    // カメラ
    AppUpdateCamera(dt);

    // 小魚群れ
    AppUpdateSchool(t);

    // 竿 & ライン
    var tension = AppGame.lineTension;
    AppUpdateRod(tension);
    AppUpdateLine(tension);

    // ファイト魚影
    AppUpdateHookedFish(t);

    // ランディング
    AppHandleLanding(dt);

    // レンダリング
    AppRenderer.render(AppScene, AppCamera);
  }

  AppAnimate();

})();


</script>
</body>
</html>
