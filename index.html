<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>チヌ釣り三昧 〜磯の主を求めて〜</title>
<style>
/* ============================================================
   チヌ釣り三昧 — 全スタイル
   深紺 #101b2d / 生成り #f2ead8 / 朱 #cc3333
   ============================================================ */

/* ---------- リセット / ベース ---------- */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #0a1420;
  color: #f2ead8;
  font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
}

/* ---------- z-index 設計 ---------- */
/* canvas: 0 (renderer が append) */
/* HUD:    10 */
/* modal:  100 */

#ui-root {
  position: fixed;
  inset: 0;
  pointer-events: none;
}

/* ============================================================
   タイトル画面
   ============================================================ */
.ui-title {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: linear-gradient(180deg, #060e18 0%, #101b2d 60%, #1a2e44 100%);
  z-index: 100;
  pointer-events: auto;
  gap: 0;
}

.ui-title__logo-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-bottom: 2.4rem;
  text-shadow: 0 2px 24px rgba(0,0,0,0.8);
}

.ui-title__main {
  font-family: "Hiragino Mincho ProN", "Yu Mincho", "ヒラギノ明朝 ProN", serif;
  font-size: clamp(2.4rem, 8vw, 5.2rem);
  font-weight: 600;
  letter-spacing: 0.22em;
  color: #f2ead8;
  line-height: 1.1;
  background: linear-gradient(180deg, #f9f3e8 0%, #d4c090 50%, #a88040 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.ui-title__sub {
  writing-mode: vertical-rl;
  text-orientation: mixed;
  font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
  font-size: clamp(0.8rem, 2.2vw, 1.15rem);
  letter-spacing: 0.3em;
  color: #b0a888;
  margin-top: 0.7rem;
  opacity: 0.88;
}

.ui-title__deco-line {
  width: clamp(160px, 40vw, 320px);
  height: 1px;
  background: linear-gradient(90deg, transparent, #c8a040, transparent);
  margin: 0.6rem 0;
}

.ui-title__start-btn {
  pointer-events: auto;
  font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
  font-size: clamp(1rem, 3vw, 1.4rem);
  letter-spacing: 0.3em;
  color: #f2ead8;
  background: rgba(16,27,45,0.7);
  border: 1.5px solid #c8a040;
  padding: 0.75em 2.5em;
  cursor: pointer;
  border-radius: 3px;
  transition: background 0.2s, border-color 0.2s, color 0.2s, box-shadow 0.2s;
  margin-top: 1.4rem;
  text-shadow: 0 1px 6px rgba(0,0,0,0.6);
  box-shadow: 0 0 18px rgba(200,160,64,0.12);
}

.ui-title__start-btn:hover {
  background: #cc3333;
  border-color: #cc3333;
  color: #fff;
  box-shadow: 0 0 28px rgba(204,51,51,0.4);
}

.ui-title__help {
  margin-top: 2rem;
  background: rgba(10,20,32,0.65);
  border: 1px solid rgba(200,160,64,0.25);
  border-radius: 6px;
  padding: 1rem 1.6rem;
  backdrop-filter: blur(8px);
  max-width: min(88vw, 480px);
  font-size: 0.82rem;
  line-height: 1.8;
  color: #c8c0a8;
  text-align: left;
}

.ui-title__help h3 {
  font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
  font-size: 0.95rem;
  color: #f2ead8;
  margin-bottom: 0.5rem;
  letter-spacing: 0.12em;
}

.ui-title__help p {
  margin-bottom: 0.2rem;
}

/* ============================================================
   HUD — 全体
   ============================================================ */
.ui-hud {
  position: absolute;
  inset: 0;
  z-index: 10;
  pointer-events: none;
  display: none;
}

.ui-hud.is-active {
  display: block;
}

/* ---------- 左上: 時刻・コイン ---------- */
.ui-hud__topleft {
  position: absolute;
  top: 12px;
  left: 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.ui-hud__time-block,
.ui-hud__coin-block {
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(6,14,24,0.62);
  border: 1px solid rgba(242,234,216,0.12);
  border-radius: 20px;
  padding: 4px 12px 4px 8px;
  backdrop-filter: blur(6px);
  font-size: 0.9rem;
  color: #f2ead8;
}

.ui-hud__time-icon {
  font-size: 1.1rem;
  line-height: 1;
}

.ui-hud__time-text {
  font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
  letter-spacing: 0.05em;
  font-size: 0.88rem;
}

.ui-hud__coin-icon {
  font-size: 1rem;
}

.ui-hud__coin-text {
  font-variant-numeric: tabular-nums;
  font-size: 0.92rem;
  letter-spacing: 0.04em;
}

/* ---------- 右上: アイコンボタン群 ---------- */
.ui-hud__topright {
  position: absolute;
  top: 12px;
  right: 12px;
  display: flex;
  gap: 8px;
  pointer-events: auto;
}

.ui-hud__icon-btn {
  pointer-events: auto;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: rgba(6,14,24,0.65);
  border: 1px solid rgba(242,234,216,0.18);
  color: #f2ead8;
  font-size: 1.25rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(6px);
  transition: background 0.18s, border-color 0.18s;
}

.ui-hud__icon-btn:hover {
  background: #cc3333;
  border-color: #cc3333;
}

/* ---------- 左下: タックル ---------- */
.ui-hud__tackle-info {
  position: absolute;
  bottom: 80px;
  left: 12px;
  background: rgba(6,14,24,0.60);
  border: 1px solid rgba(242,234,216,0.10);
  border-radius: 6px;
  padding: 6px 12px;
  backdrop-filter: blur(6px);
  font-size: 0.76rem;
  color: #b0a888;
  line-height: 1.7;
  max-width: 200px;
}

.ui-hud__tackle-info span {
  color: #f2ead8;
}

/* ---------- 下中央: 状態テキスト ---------- */
.ui-hud__status {
  position: absolute;
  bottom: 96px;
  left: 50%;
  transform: translateX(-50%);
  font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
  font-size: clamp(0.9rem, 2.5vw, 1.15rem);
  letter-spacing: 0.18em;
  color: #f2ead8;
  text-shadow: 0 0 16px rgba(0,0,0,0.9), 0 2px 8px rgba(0,0,0,0.8);
  pointer-events: none;
  text-align: center;
  white-space: nowrap;
}

.ui-hud__status.is-bite {
  color: #ff4444;
  font-size: clamp(1.1rem, 3vw, 1.5rem);
  text-shadow: 0 0 24px rgba(255,68,68,0.7);
}

/* ---------- キャストメーター ---------- */
.ui-hud__cast-meter {
  position: absolute;
  bottom: 60px;
  left: 50%;
  transform: translateX(-50%);
  width: min(340px, 70vw);
  display: none;
}

.ui-hud__cast-meter.is-active {
  display: block;
}

.ui-hud__cast-meter-label {
  font-size: 0.72rem;
  color: #b0a888;
  text-align: center;
  margin-bottom: 4px;
  letter-spacing: 0.12em;
}

.ui-hud__cast-meter-track {
  width: 100%;
  height: 14px;
  background: rgba(6,14,24,0.7);
  border: 1px solid rgba(242,234,216,0.18);
  border-radius: 7px;
  overflow: hidden;
  position: relative;
}

.ui-hud__cast-meter-fill {
  height: 100%;
  width: 0%;
  border-radius: 7px;
  transition: background 0.1s;
  background: linear-gradient(90deg, #22aa55, #aacc22, #cc3333);
}

/* ---------- テンションバー (ファイト中のみ) ---------- */
.ui-hud__tension-panel {
  position: absolute;
  top: 50%;
  right: 16px;
  transform: translateY(-50%);
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  pointer-events: none;
}

.ui-hud__tension-panel.is-active {
  display: flex;
}

.ui-hud__tension-label {
  font-size: 0.68rem;
  color: #b0a888;
  letter-spacing: 0.08em;
  writing-mode: vertical-rl;
}

.ui-hud__tension-track {
  width: 18px;
  height: 160px;
  background: rgba(6,14,24,0.7);
  border: 1px solid rgba(242,234,216,0.16);
  border-radius: 9px;
  overflow: hidden;
  display: flex;
  align-items: flex-end;
  position: relative;
}

.ui-hud__tension-fill {
  width: 100%;
  height: 0%;
  border-radius: 0 0 9px 9px;
  background: #22bb55;
  transition: height 0.08s linear, background 0.2s;
}

.ui-hud__tension-fill.is-warn {
  background: #ddaa11;
}

.ui-hud__tension-fill.is-danger {
  background: #cc3333;
  animation: tension-blink 0.3s infinite alternate;
}

@keyframes tension-blink {
  from { opacity: 1; }
  to   { opacity: 0.35; }
}

.ui-hud__fish-distance {
  font-size: 0.8rem;
  color: #f2ead8;
  font-variant-numeric: tabular-nums;
  text-align: center;
  line-height: 1.4;
}

.ui-hud__fish-distance small {
  display: block;
  font-size: 0.62rem;
  color: #888;
}

.ui-hud__stamina-track {
  width: 72px;
  height: 8px;
  background: rgba(6,14,24,0.7);
  border: 1px solid rgba(242,234,216,0.16);
  border-radius: 4px;
  overflow: hidden;
}

.ui-hud__stamina-fill {
  height: 100%;
  background: #22aa66;
  border-radius: 4px;
  transition: width 0.1s;
}

.ui-hud__stamina-label {
  font-size: 0.62rem;
  color: #888;
  text-align: center;
}

/* ============================================================
   アタリ演出
   ============================================================ */
/* 前アタリ: ウキ周辺的な小演出 — 画面左下寄り */
.ui-bite-minor {
  position: absolute;
  bottom: 30%;
  left: 40%;
  pointer-events: none;
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 20;
}

.ui-bite-minor.is-active {
  display: flex;
}

.ui-bite-minor__ripple {
  position: absolute;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  border: 2px solid rgba(100,180,255,0.6);
  animation: ripple-out 1.2s ease-out infinite;
}

.ui-bite-minor__ripple:nth-child(2) { animation-delay: 0.4s; }
.ui-bite-minor__ripple:nth-child(3) { animation-delay: 0.8s; }

@keyframes ripple-out {
  from { transform: scale(0.2); opacity: 0.9; }
  to   { transform: scale(2.8); opacity: 0; }
}

.ui-bite-minor__text {
  position: relative;
  font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
  font-size: 1.1rem;
  color: #aaddff;
  text-shadow: 0 0 8px rgba(100,200,255,0.8);
  z-index: 1;
  animation: minor-pulse 0.8s ease-in-out infinite alternate;
}

@keyframes minor-pulse {
  from { opacity: 0.5; transform: scale(0.95); }
  to   { opacity: 1.0; transform: scale(1.05); }
}

/* 本アタリ: 大きな「!!」 + 赤フラッシュ */
.ui-bite-major {
  position: absolute;
  inset: 0;
  pointer-events: none;
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 25;
}

.ui-bite-major.is-active {
  display: flex;
  animation: major-flash 0.18s ease-out;
}

@keyframes major-flash {
  0%  { background: rgba(200,30,30,0.55); }
  100%{ background: rgba(200,30,30,0); }
}

.ui-bite-major__text {
  font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
  font-size: clamp(4rem, 14vw, 9rem);
  font-weight: 700;
  color: #ff2222;
  text-shadow:
    0 0 40px rgba(255,50,50,0.9),
    0 0 80px rgba(255,50,50,0.5),
    0 4px 12px rgba(0,0,0,0.9);
  animation: major-zoom 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  letter-spacing: 0.05em;
}

@keyframes major-zoom {
  from { transform: scale(0.3) rotate(-8deg); opacity: 0; }
  60%  { transform: scale(1.12) rotate(2deg); opacity: 1; }
  to   { transform: scale(1.0) rotate(0deg); opacity: 1; }
}

/* ============================================================
   釣果モーダル
   ============================================================ */
.ui-catch-modal {
  position: absolute;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  pointer-events: auto;
  background: rgba(4,10,18,0.72);
  backdrop-filter: blur(4px);
}

.ui-catch-modal.is-active {
  display: flex;
}

.ui-catch-card {
  position: relative;
  width: min(480px, 90vw);
  background: #f5ede0;
  border-radius: 6px;
  padding: 2rem 2.2rem 1.6rem;
  color: #1a1410;
  box-shadow:
    0 0 0 1px rgba(160,120,40,0.4),
    0 8px 48px rgba(0,0,0,0.7),
    inset 0 0 60px rgba(220,200,160,0.18);
  animation: card-in 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  overflow: hidden;
}

/* 和紙テクスチャ風のノイズ重ね */
.ui-catch-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    repeating-linear-gradient(
      90deg,
      transparent,
      transparent 2px,
      rgba(180,160,120,0.04) 2px,
      rgba(180,160,120,0.04) 4px
    ),
    repeating-linear-gradient(
      0deg,
      transparent,
      transparent 3px,
      rgba(180,160,120,0.03) 3px,
      rgba(180,160,120,0.03) 6px
    );
  pointer-events: none;
  border-radius: 6px;
}

/* fantasy 種: 金枠 */
.ui-catch-card.is-fantasy {
  border: 2px solid #b8860b;
  box-shadow:
    0 0 0 1px #b8860b,
    0 0 18px rgba(184,134,11,0.5),
    0 8px 48px rgba(0,0,0,0.7);
}

/* キラ演出 (fantasy) */
.ui-catch-card.is-fantasy::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(
    125deg,
    transparent 0%,
    transparent 40%,
    rgba(255,230,100,0.3) 50%,
    transparent 60%,
    transparent 100%
  );
  animation: kira-sweep 2s ease-in-out infinite;
  pointer-events: none;
}

@keyframes kira-sweep {
  0%   { transform: translateX(-120%) skewX(-20deg); }
  60%  { transform: translateX(220%)  skewX(-20deg); }
  100% { transform: translateX(220%)  skewX(-20deg); }
}

@keyframes card-in {
  from { transform: translateY(32px) scale(0.92); opacity: 0; }
  to   { transform: translateY(0)    scale(1);    opacity: 1; }
}

.ui-catch-card__badges {
  position: absolute;
  top: 12px;
  right: 14px;
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: flex-end;
}

.ui-catch-badge {
  font-size: 0.72rem;
  font-weight: 700;
  padding: 3px 9px;
  border-radius: 3px;
  letter-spacing: 0.06em;
}

.ui-catch-badge.is-new {
  background: #cc3333;
  color: #fff;
}

.ui-catch-badge.is-record {
  background: #c8860b;
  color: #fff;
}

.ui-catch-card__fish-name {
  font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
  font-size: clamp(1.6rem, 5vw, 2.4rem);
  font-weight: 600;
  letter-spacing: 0.12em;
  color: #1a1410;
  margin-bottom: 2px;
  line-height: 1.15;
}

.ui-catch-card__fish-name-en {
  font-size: 0.82rem;
  color: #6a5a40;
  letter-spacing: 0.08em;
  margin-bottom: 1rem;
}

.ui-catch-card__svg-wrap {
  text-align: center;
  margin: 0.6rem 0 1rem;
  min-height: 80px;
}

.ui-catch-card__svg-wrap svg {
  filter: drop-shadow(0 3px 12px rgba(0,0,0,0.2));
  max-width: 100%;
}

.ui-catch-card__stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 1rem;
}

.ui-catch-stat {
  background: rgba(160,130,80,0.12);
  border: 1px solid rgba(160,130,80,0.25);
  border-radius: 4px;
  padding: 6px 8px;
  text-align: center;
}

.ui-catch-stat__label {
  font-size: 0.66rem;
  color: #6a5a40;
  margin-bottom: 2px;
  letter-spacing: 0.08em;
}

.ui-catch-stat__value {
  font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
  font-size: 1.05rem;
  color: #1a1410;
  font-variant-numeric: tabular-nums;
}

.ui-catch-card__coins {
  text-align: center;
  font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
  font-size: 1.1rem;
  color: #8a6010;
  margin-bottom: 1.2rem;
  letter-spacing: 0.08em;
}

.ui-catch-card__close-btn {
  display: block;
  width: 100%;
  font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
  font-size: 1rem;
  letter-spacing: 0.25em;
  color: #f2ead8;
  background: #101b2d;
  border: 1px solid rgba(242,234,216,0.22);
  padding: 0.65em 0;
  border-radius: 3px;
  cursor: pointer;
  transition: background 0.18s, border-color 0.18s;
}

.ui-catch-card__close-btn:hover {
  background: #cc3333;
  border-color: #cc3333;
}

/* ============================================================
   図鑑
   ============================================================ */
.ui-dex {
  position: absolute;
  inset: 0;
  display: none;
  flex-direction: column;
  z-index: 100;
  pointer-events: auto;
  background: rgba(4,10,18,0.88);
  backdrop-filter: blur(10px);
}

.ui-dex.is-active {
  display: flex;
}

.ui-panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  border-bottom: 1px solid rgba(242,234,216,0.12);
  background: rgba(6,14,24,0.5);
  flex-shrink: 0;
}

.ui-panel-header__title {
  font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
  font-size: 1.15rem;
  letter-spacing: 0.2em;
  color: #f2ead8;
}

.ui-panel-header__sub {
  font-size: 0.78rem;
  color: #888;
  margin-left: 12px;
}

.ui-panel-close {
  pointer-events: auto;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(242,234,216,0.15);
  color: #f2ead8;
  font-size: 1.1rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.18s;
}

.ui-panel-close:hover { background: #cc3333; }

.ui-dex__grid-wrap {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  overscroll-behavior: contain;
}

.ui-dex__grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
  gap: 10px;
}

@media (max-width: 480px) {
  .ui-dex__grid {
    grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
  }
}

.ui-dex-cell {
  background: rgba(10,20,34,0.7);
  border: 1.5px solid rgba(242,234,216,0.10);
  border-radius: 6px;
  padding: 8px 6px 6px;
  cursor: pointer;
  transition: border-color 0.18s, box-shadow 0.18s, transform 0.12s;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}

.ui-dex-cell:hover {
  border-color: rgba(200,160,64,0.5);
  box-shadow: 0 0 12px rgba(200,160,64,0.12);
  transform: translateY(-2px);
}

.ui-dex-cell.is-caught {
  border-color: rgba(34,170,100,0.45);
}

.ui-dex-cell.is-fantasy {
  border-color: rgba(160,60,220,0.5);
}

.ui-dex-cell.is-fantasy.is-caught {
  border-color: #a03cdc;
  box-shadow: 0 0 10px rgba(160,60,220,0.3);
}

.ui-dex-cell__silhouette {
  width: 64px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.ui-dex-cell__silhouette svg {
  max-width: 100%;
  max-height: 100%;
}

.ui-dex-cell__name {
  font-size: 0.68rem;
  color: #f2ead8;
  line-height: 1.3;
  word-break: break-all;
}

.ui-dex-cell.is-unknown .ui-dex-cell__name {
  color: #555;
}

.ui-dex-cell__count {
  font-size: 0.62rem;

// ── 内部レジストリ ──────────────────────────────────────────────────
const _FishRegistry = new Set();

// ── テクスチャキャッシュ ─────────────────────────────────────────────
const _FishTexCache = new Map();

// ── ユーティリティ ───────────────────────────────────────────────────

function _fishHex(hex) {
  const c = new THREE.Color(hex);
  return c;
}

function _fishLerp(a, b, t) { return a + (b - a) * t; }

function _fishClamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

// CatmullRomスプライン点列生成
function _fishCatmull(pts, t) {
  const n = pts.length - 1;
  const seg = _fishClamp(Math.floor(t * n), 0, n - 1);
  const lt = t * n - seg;
  const p0 = pts[Math.max(0, seg - 1)];
  const p1 = pts[seg];
  const p2 = pts[Math.min(n, seg + 1)];
  const p3 = pts[Math.min(n, seg + 2)];
  const t2 = lt * lt, t3 = lt * t2;
  return 0.5 * (
    (2 * p1) +
    (-p0 + p2) * lt +
    (2 * p0 - 5 * p1 + 4 * p2 - p3) * t2 +
    (-p0 + 3 * p1 - 3 * p2 + p3) * t3
  );
}

// ── テクスチャ生成 ────────────────────────────────────────────────────

function _fishMakeTexture(species) {
  const m = species.model;
  const key = species.id + '_' + (m.pattern ? m.pattern.type : 'none');
  if (_FishTexCache.has(key)) return _FishTexCache.get(key);

  const W = 512, H = 256;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  const c = m.colors;

  // 背→腹 縦グラデ
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0.0, c.back);
  grad.addColorStop(0.35, c.base);
  grad.addColorStop(0.65, c.base);
  grad.addColorStop(1.0, c.belly);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // pattern 描画
  const p = m.pattern;
  if (p && p.type !== 'none') {
    ctx.save();
    ctx.globalAlpha = p.opacity || 0.5;
    ctx.fillStyle = p.color || '#333';
    ctx.strokeStyle = p.color || '#333';
    const cnt = p.count || 6;

    if (p.type === 'vbars') {
      // 縦縞(体軸方向の縞)
      for (let i = 0; i < cnt; i++) {
        const x = (i + 0.5) / cnt * W;
        const bw = W / cnt * 0.35;
        ctx.fillRect(x - bw / 2, 0, bw, H);
      }
    } else if (p.type === 'hstripes') {
      // 横縞
      for (let i = 0; i < cnt; i++) {
        const y = (i + 0.5) / cnt * H;
        const bh = H / cnt * 0.4;
        ctx.fillRect(0, y - bh / 2, W, bh);
      }
    } else if (p.type === 'spots') {
      const rng = _fishSeededRng(species.id);
      for (let i = 0; i < cnt * 3; i++) {
        const x = rng() * W;
        const y = H * 0.1 + rng() * H * 0.8;
        const r = 8 + rng() * 18;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (p.type === 'speckle') {
      const rng = _fishSeededRng(species.id);
      for (let i = 0; i < cnt * 15; i++) {
        const x = rng() * W;
        const y = H * 0.05 + rng() * H * 0.9;
        const r = 2 + rng() * 6;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (p.type === 'marble') {
      // 大理石風の曲線縞
      ctx.lineWidth = 3;
      const rng = _fishSeededRng(species.id);
      for (let i = 0; i < cnt; i++) {
        ctx.beginPath();
        const startX = rng() * W;
        ctx.moveTo(startX, 0);
        for (let y = 0; y <= H; y += 8) {
          const x = startX + Math.sin(y * 0.04 + rng() * 6) * 40 + Math.sin(y * 0.02) * 30;
          ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  // 鱗ノイズ(細かい六角格子状の明暗)
  ctx.save();
  ctx.globalAlpha = 0.06;
  const scaleW = 18, scaleH = 14;
  for (let row = 0; row < Math.ceil(H / scaleH) + 1; row++) {
    const offsetX = (row % 2) * (scaleW * 0.5);
    for (let col = 0; col < Math.ceil(W / scaleW) + 1; col++) {
      const sx = col * scaleW + offsetX;
      const sy = row * scaleH;
      // 楕円で鱗一枚
      ctx.beginPath();
      ctx.ellipse(sx, sy, scaleW * 0.45, scaleH * 0.45, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 0.4;
      ctx.stroke();
    }
  }
  ctx.restore();

  // 鰓蓋ライン(体軸 u≈0.18 付近の縦弧)
  ctx.save();
  ctx.globalAlpha = 0.25;
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 2;
  const gillX = W * 0.18;
  ctx.beginPath();
  ctx.moveTo(gillX, H * 0.1);
  ctx.quadraticCurveTo(gillX + 18, H * 0.5, gillX, H * 0.9);
  ctx.stroke();
  ctx.restore();

  // 腹部明部ハイライト
  ctx.save();
  const bellyGrad = ctx.createLinearGradient(0, H * 0.55, 0, H);
  bellyGrad.addColorStop(0, 'rgba(255,255,255,0)');
  bellyGrad.addColorStop(1, 'rgba(255,255,255,0.18)');
  ctx.fillStyle = bellyGrad;
  ctx.fillRect(0, H * 0.55, W, H * 0.45);
  ctx.restore();

  const tex = new THREE.CanvasTexture(canvas);
  tex.needsUpdate = true;
  _FishTexCache.set(key, tex);
  return tex;
}

// シード乱数
function _fishSeededRng(seed) {
  let h = 0;
  for (let i = 0; i < seed.length; i++) { h = ((h << 5) - h + seed.charCodeAt(i)) | 0; }
  return function() {
    h = Math.imul(h ^ (h >>> 16), 0x45d9f3b);
    h = Math.imul(h ^ (h >>> 16), 0x45d9f3b);
    h ^= h >>> 16;
    return ((h >>> 0) / 0xffffffff);
  };
}

// ── スウェイ頂点シェーダ(onBeforeCompile用) ─────────────────────────

function _fishInjectSway(mat) {
  mat.userData.uTime = { value: 0.0 };
  mat.onBeforeCompile = function(shader) {
    shader.uniforms.uTime = mat.userData.uTime;
    // 頂点シェーダ先頭にuniform宣言
    shader.vertexShader = 'uniform float uTime;\n' + shader.vertexShader;
    // #include <begin_vertex> の直後にスウェイ変位を注入
    shader.vertexShader = shader.vertexShader.replace(
      '#include <begin_vertex>',
      `#include <begin_vertex>
      // 体軸後方ほど振幅が増すスウェイ
      // uv.x = 体軸u (0=頭 1=尾)
      float swayU = uv.x;
      float amp = swayU * swayU * 0.06;
      float freq = 2.5;
      float phase = uTime * 3.5 - swayU * 6.0;
      transformed.x += sin(phase) * amp;
      `
    );
  };
}

  if (m.snout === 'pointed') {
    ctrlPts[0][2] *= 0.4;
    ctrlPts[0][3] *= 0.4;
    if (ctrlPts[1]) { ctrlPts[1][2] *= 0.55; ctrlPts[1][3] *= 0.55; }
  } else if (m.snout === 'long') {
    // longは口先u=0の断面を極細化
    ctrlPts[0][2] *= 0.2;
    ctrlPts[0][3] *= 0.2;
    if (ctrlPts[1]) { ctrlPts[1][2] *= 0.3; ctrlPts[1][3] *= 0.3; }
    if (ctrlPts[2]) { ctrlPts[2][2] *= 0.5; ctrlPts[2][3] *= 0.5; }
  }

  // flat プロファイル: 断面を水平に押し潰す変換(halfW >> halfH)
  const flatRatio = (profile === 'flat') ? 3.5 : 1.0;

  // スプラインから u 地点の断面パラメータを補間
  function sampleProfile(u) {
    const n = ctrlPts.length;
    // u を [0,1] に対応する i を求める
    let i = 0;
    for (let k = 0; k < n - 1; k++) {
      if (u <= ctrlPts[k + 1][0]) { i = k; break; }
      i = k;
    }
    const u0 = ctrlPts[i][0], u1 = ctrlPts[Math.min(i + 1, n - 1)][0];
    const t = (u1 > u0) ? (u - u0) / (u1 - u0) : 0;
    const cY = _fishLerp(ctrlPts[i][1], ctrlPts[Math.min(i+1,n-1)][1], t);
    const hH = _fishLerp(ctrlPts[i][2], ctrlPts[Math.min(i+1,n-1)][2], t);
    const hW = _fishLerp(ctrlPts[i][3], ctrlPts[Math.min(i+1,n-1)][3], t);
    return { cY, hH, hW };
  }

  // ジオメトリ生成
  const numU = SEG_U + 1; // 体軸方向頂点数
  const numV = SEG_V + 1; // 周方向頂点数

  const positions = new Float32Array(numU * numV * 3);
  const normals   = new Float32Array(numU * numV * 3);
  const uvs       = new Float32Array(numU * numV * 2);
  const indices   = [];

  for (let iu = 0; iu < numU; iu++) {
    const u = iu / (numU - 1);
    const zPos = (u - 0.5) * length; // 体軸方向(z軸): 頭が-z、尾が+z
    const sp = sampleProfile(u);

    for (let iv = 0; iv < numV; iv++) {
      const v = iv / (numV - 1);
      // 楕円断面: v=0が背面(上)、v=0.5が腹面(下)
      const theta = v * Math.PI * 2;

      // flat プロファイルは y(左右)を大きく、x(上下)を小さく
      let cosT = Math.cos(theta);
      let sinT = Math.sin(theta);

      const px = sp.hH * cosT * (1.0 / flatRatio) + sp.cY * length;
      const py = sp.hW * sinT * flatRatio;
      const pz = zPos;

      const idx = iu * numV + iv;
      positions[idx * 3 + 0] = py;     // x = 左右
      positions[idx * 3 + 1] = px;     // y = 上下
      positions[idx * 3 + 2] = pz;     // z = 体軸

      // UV: u=体軸, v=周
      uvs[idx * 2 + 0] = u;
      uvs[idx * 2 + 1] = v;
    }
  }

  // インデックス生成
  for (let iu = 0; iu < SEG_U; iu++) {
    for (let iv = 0; iv < SEG_V; iv++) {
      const a = iu * numV + iv;
      const b = iu * numV + iv + 1;
      const c = (iu + 1) * numV + iv;
      const d = (iu + 1) * numV + iv + 1;
      indices.push(a, c, b);
      indices.push(b, c, d);
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('normal',   new THREE.BufferAttribute(normals,   3));
  geo.setAttribute('uv',       new THREE.BufferAttribute(uvs,       2));
  geo.setIndex(indices);
  geo.computeVertexNormals();

  return geo;
}

// ── 鰭Shape生成 ──────────────────────────────────────────────────────

function _fishFinShape(type, w, h, spiny) {
  const shape = new THREE.Shape();
  if (type === 'dorsal') {
    // 背鰭: 台形〜三角
    shape.moveTo(0, 0);
    if (spiny) {
      // 棘条ギザ輪郭
      const nSpines = Math.max(5, Math.round(w * 25));
      for (let i = 0; i <= nSpines; i++) {
        const t = i / nSpines;
        const x = t * w;
        const y = (i % 2 === 0) ? h * 0.9 : h * 0.55;
        shape.lineTo(x, y);
      }
    } else {
      shape.lineTo(w * 0.1, h);
      shape.lineTo(w * 0.85, h * 0.75);
    }
    shape.lineTo(w, 0);
    shape.lineTo(0, 0);
  } else if (type === 'anal') {
    shape.moveTo(0, 0);
    shape.lineTo(w * 0.15, -h);
    shape.lineTo(w * 0.85, -h * 0.65);
    shape.lineTo(w, 0);
    shape.lineTo(0, 0);
  } else if (type === 'pectoral') {
    // 胸鰭: 扇形
    shape.moveTo(0, 0);
    shape.bezierCurveTo(
      -w * 0.3, h * 0.5,
      w * 0.3, h * 1.1,
      w, h * 0.8
    );
    shape.bezierCurveTo(
      w * 1.1, h * 0.4,
      w * 0.5, -h * 0.2,
      0, 0
    );
  }
  return shape;
}

// 尾鰭輪郭
function _fishTailShape(tailType, w, h) {
  const shape = new THREE.Shape();
  if (tailType === 'forked') {
    // 二叉尾
    shape.moveTo(0, 0);
    shape.bezierCurveTo(-w * 0.3, h * 0.3, -w * 0.5, h * 1.0, -w * 0.2, h);
    shape.bezierCurveTo(0, h * 0.9, 0, h * 0.55, 0, h * 0.45);
    shape.bezierCurveTo(0, h * 0.55, 0, h * 0.9, w * 0.2, h);
    shape.bezierCurveTo(w * 0.5, h * 1.0, w * 0.3, h * 0.3, 0, 0);
  } else if (tailType === 'lunate') {
    // 三日月尾(高速遊泳魚)
    shape.moveTo(0, 0);
    shape.bezierCurveTo(-w * 0.2, h * 0.2, -w * 0.8, h * 1.1, -w * 0.15, h * 0.9);
    shape.bezierCurveTo(-w * 0.05, h * 0.6, 0, h * 0.5, 0, h * 0.42);
    shape.bezierCurveTo(0, h * 0.5, w * 0.05, h * 0.6, w * 0.15, h * 0.9);
    shape.bezierCurveTo(w * 0.8, h * 1.1, w * 0.2, h * 0.2, 0, 0);
  } else if (tailType === 'rounded') {
    // 丸尾
    shape.moveTo(0, 0);
    shape.bezierCurveTo(-w * 0.6, h * 0.3, -w * 0.7, h, 0, h * 0.95);
    shape.bezierCurveTo(w * 0.7, h, w * 0.6, h * 0.3, 0, 0);
  } else if (tailType === 'truncate') {
    // 切尾
    shape.moveTo(0, 0);
    shape.lineTo(-w * 0.55, h * 0.2);
    shape.lineTo(-w * 0.6, h * 0.85);
    shape.lineTo(0, h * 0.92);
    shape.lineTo(w * 0.6, h * 0.85);
    shape.lineTo(w * 0.55, h * 0.2);
    shape.lineTo(0, 0);
  } else if (tailType === 'pointed') {
    // 尖尾
    shape.moveTo(0, 0);
    shape.bezierCurveTo(-w * 0.3, h * 0.4, -w * 0.2, h * 0.8, 0, h);
    shape.bezierCurveTo(w * 0.2, h * 0.8, w * 0.3, h * 0.4, 0, 0);
  } else {
    // default: rounded
    shape.moveTo(0, 0);
    shape.bezierCurveTo(-w * 0.6, h * 0.3, -w * 0.7, h, 0, h * 0.95);
    shape.bezierCurveTo(w * 0.7, h, w * 0.6, h * 0.3, 0, 0);
  }
  return shape;
}

// ── 鰭メッシュ生成 ────────────────────────────────────────────────────

function _fishMakeFin(shape, depth, finColor, opacity) {
  const extSettings = {
    depth: depth,
    bevelEnabled: false,
    steps: 1
  };
  const geo = new THREE.ExtrudeGeometry(shape, extSettings);
  const mat = new THREE.MeshPhysicalMaterial({
    color: finColor,
    transparent: true,
    opacity: opacity,
    side: THREE.DoubleSide,
    roughness: 0.5,
    metalness: 0.0,
    depthWrite: false
  });
  return new THREE.Mesh(geo, mat);
}

// ── イカ外套膜生成 ─────────────────────────────────────────────────────

function _fishMakeSquidBody(m, length, colors) {
  const group = new THREE.Group();

  // 外套膜: 滑らかな円錐曲面
  const nSeg = 32;
  const nRings = 20;
  const positions = new Float32Array((nRings + 1) * (nSeg + 1) * 3);
  const normals   = new Float32Array((nRings + 1) * (nSeg + 1) * 3);
  const uvs       = new Float32Array((nRings + 1) * (nSeg + 1) * 2);
  const indices   = [];

  for (let ir = 0; ir <= nRings; ir++) {
    const u = ir / nRings;
    // 外套膜: 前方(u=0)が丸く後方(u=1)が先細り
    const r = Math.sin(u * Math.PI) * 0.5 * length * m.bodyH;
    const z = (u - 0.5) * length;

    for (let is = 0; is <= nSeg; is++) {
      const v = is / nSeg;
      const theta = v * Math.PI * 2;
      const idx = ir * (nSeg + 1) + is;

      const x = Math.cos(theta) * r * (m.bodyW / m.bodyH);
      const y = Math.sin(theta) * r;

      positions[idx * 3 + 0] = x;
      positions[idx * 3 + 1] = y;
      positions[idx * 3 + 2] = z;
      uvs[idx * 2 + 0] = u;
      uvs[idx * 2 + 1] = v;
    }
  }
  for (let ir = 0; ir < nRings; ir++) {
    for (let is = 0; is < nSeg; is++) {
      const a = ir * (nSeg + 1) + is;
      const b = ir * (nSeg + 1) + is + 1;
      const c = (ir + 1) * (nSeg + 1) + is;
      const d = (ir + 1) * (nSeg + 1) + is + 1;
      indices.push(a, c, b);
      indices.push(b, c, d);
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('normal', new THREE.BufferAttribute(normals, 3));
  geo.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
  geo.setIndex(indices);
  geo.computeVertexNormals();

  const mat = new THREE.MeshPhysicalMaterial({
    color: colors.base,
    roughness: 0.4,
    metalness: 0.1,
    clearcoat: 0.5,
    clearcoatRoughness: 0.3,
    side: THREE.DoubleSide
  });
  const mantleMesh = new THREE.Mesh(geo, mat);
  group.add(mantleMesh);

  // 脚8本以上 (TubeGeometry、先細り、軽く波打ち)
  const nTentacles = 8;
  const tentacleLen = length * 0.55;
  for (let t = 0; t < nTentacles; t++) {
    const angle = (t / nTentacles) * Math.PI * 2;
    const baseR = length * m.bodyH * 0.25;
    const curve = new THREE.CatmullRomCurve3(
      Array.from({ length: 8 }, (_, k) => {
        const kf = k / 7;
        const wave = Math.sin(kf * Math.PI * 2.5 + angle) * 0.04 * length * kf;
        return new THREE.Vector3(
          Math.cos(angle) * (baseR * (1 - kf * 0.85) + wave),
          Math.sin(angle) * (baseR * (1 - kf * 0.85)),
          -length * 0.5 - kf * tentacleLen
        );
      })
    );
    const tubeRadii = (t) => 0.025 * length * (1 - t * 0.9);
    // TubeGeometry は一定半径 — 先細りは小さめ半径で近似
    const tubeGeo = new THREE.TubeGeometry(curve, 12, 0.018 * length, 6, false);
    const tubeMat = new THREE.MeshPhysicalMaterial({
      color: colors.fins,
      roughness: 0.5,
      metalness: 0.05
    });
    const tubeMesh = new THREE.Mesh(tubeGeo, tubeMat);
    group.add(tubeMesh);
  }

  // ヒレ (側縁の薄いフラップ)
  const finShape = new THREE.Shape();
  finShape.moveTo(0, 0);
  finShape.bezierCurveTo(length * 0.2, length * m.bodyH * 0.4, length * 0.6, length * m.bodyH * 0.35, length * 0.8, 0);
  finShape.lineTo(0, 0);
  const finGeo = new THREE.ShapeGeometry(finShape);
  const finMat = new THREE.MeshPhysicalMaterial({
    color: colors.fins,
    transparent: true,
    opacity: 0.75,
    side: THREE.DoubleSide,
    roughness: 0.45,
    metalness: 0.0
  });
  for (let side = -1; side <= 1; side += 2) {
    const finMesh = new THREE.Mesh(finGeo, finMat);
    finMesh.rotation.x = Math.PI / 2;
    finMesh.position.set(side * length * m.bodyH * 0.42, 0, -length * 0.4);
    group.add(finMesh);
  }

  return { group, mantleMesh };
}

// ── 目メッシュ生成 ────────────────────────────────────────────────────

function _fishMakeEye(eyeColor, eyeRadius) {
  const eyeGroup = new THREE.Group();

  // 強膜(白目)
  const scleraGeo = new THREE.SphereGeometry(eyeRadius, 12, 10);
  const scleraMat = new THREE.MeshPhysicalMaterial({
    color: '#ddd8cc',
    roughness: 0.3,
    metalness: 0.0,
    clearcoat: 0.8,
    clearcoatRoughness: 0.1
  });
  const scleraMesh = new THREE.Mesh(scleraGeo, scleraMat);
  eyeGroup.add(scleraMesh);

  // 虹彩+瞳孔
  const irisGeo = new THREE.SphereGeometry(eyeRadius * 0.72, 12, 10);
  const irisMat = new THREE.MeshPhysicalMaterial({
    color: eyeColor,
    roughness: 0.25,
    metalness: 0.0,
    clearcoat: 1.0,
    clearcoatRoughness: 0.05
  });
  const irisMesh = new THREE.Mesh(irisGeo, irisMat);
  irisMesh.position.z = eyeRadius * 0.35;
  eyeGroup.add(irisMesh);

  // ハイライト
  const hlGeo = new THREE.SphereGeometry(eyeRadius * 0.22, 8, 8);
  const hlMat = new THREE.MeshBasicMaterial({ color: '#ffffff' });
  const hlMesh = new THREE.Mesh(hlGeo, hlMat);
  hlMesh.position.set(eyeRadius * 0.25, eyeRadius * 0.3, eyeRadius * 0.65);
  eyeGroup.add(hlMesh);

  return eyeGroup;
}

// ── special 演出 ──────────────────────────────────────────────────────

function _fishApplySpecial(group, special, length, bodyMat) {
  if (!special) return;

  if (special === 'whiskers') {
    // 口元ひげ TubeGeometry
    const nWhiskers = 4;
    for (let i = 0; i < nWhiskers; i++) {
      const side = (i % 2 === 0) ? 1 : -1;
      const vert = (i < 2) ? 1 : -1;
      const curve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(side * 0.01, vert * 0.01, -length * 0.49),
        new THREE.Vector3(side * 0.04, vert * 0.02, -length * 0.52),
        new THREE.Vector3(side * 0.08, vert * 0.01, -length * 0.56),
        new THREE.Vector3(side * 0.11, vert * -0.01, -length * 0.60)
      ]);
      const geo = new THREE.TubeGeometry(curve, 8, 0.004 * length, 5, false);
      const mat = new THREE.MeshPhysicalMaterial({ color: '#888', roughness: 0.6 });
      group.add(new THREE.Mesh(geo, mat));
    }
  }

  if (special === 'glow') {
    // emissive強化
    if (bodyMat) {
      bodyMat.emissive = new THREE.Color('#00aaff');
      bodyMat.emissiveIntensity = 0.4;
    }
    // 誘引棒
    const stalkCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(0, length * 0.12, -length * 0.42),
      new THREE.Vector3(0.01 * length, length * 0.22, -length * 0.48),
      new THREE.Vector3(0, length * 0.28, -length * 0.40)
    ]);
    const stalkGeo = new THREE.TubeGeometry(stalkCurve, 8, 0.005 * length, 5, false);
    const stalkMat = new THREE.MeshPhysicalMaterial({ color: '#334', roughness: 0.5 });
    group.add(new THREE.Mesh(stalkGeo, stalkMat));

    // 発光球
    const lureGeo = new THREE.SphereGeometry(0.022 * length, 10, 10);
    const lureMat = new THREE.MeshPhysicalMaterial({
      color: '#88ddff',
      emissive: '#55aaff',
      emissiveIntensity: 1.5,
      roughness: 0.2,
      metalness: 0.0,
      transparent: true,
      opacity: 0.9
    });
    const lureMesh = new THREE.Mesh(lureGeo, lureMat);
    lureMesh.position.set(0, length * 0.28, -length * 0.40);
    group.add(lureMesh);

    // PointLight
    const pl = new THREE.PointLight('#77ccff', 1.5, length * 3);
    pl.position.copy(lureMesh.position);
    group.add(pl);
  }

  if (special === 'horn') {
    // 額の角
    const hornCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(0, length * 0.15, -length * 0.3),
      new THREE.Vector3(0, length * 0.25, -length * 0.35),
      new THREE.Vector3(0, length * 0.32, -length * 0.42)
    ]);
    const hornGeo = new THREE.TubeGeometry(hornCurve, 8, 0.012 * length, 5, false);
    const hornMat = new THREE.MeshPhysicalMaterial({ color: '#ccaa66', roughness: 0.4, metalness: 0.3 });
    group.add(new THREE.Mesh(hornGeo, hornMat));
  }

  if (special === 'tentacles') {
    // 追加触手(8本)
    for (let t = 0; t < 8; t++) {
      const angle = (t / 8) * Math.PI * 2;
      const r = length * 0.08;
      const tentCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(Math.cos(angle) * r, Math.sin(angle) * r, -length * 0.45),
        new THREE.Vector3(Math.cos(angle) * r * 2, Math.sin(angle) * r * 2, -length * 0.52),
        new THREE.Vector3(Math.cos(angle) * r * 2.5, Math.sin(angle) * r * 2, -length * 0.62),
        new THREE.Vector3(Math.cos(angle) * r * 2.2, Math.sin(angle) * r * 1.5, -length * 0.70)
      ]);
      const tentGeo = new THREE.TubeGeometry(tentCurve, 10, 0.008 * length, 6, false);
      const tentMat = new THREE.MeshPhysicalMaterial({ color: '#cca888', roughness: 0.5 });
      group.add(new THREE.Mesh(tentGeo, tentMat));
    }
  }

  if (special === 'crown') {
    // 頭上の金の冠
    const nPoints = 6;
    for (let i = 0; i < nPoints; i++) {
      const angle = (i / nPoints) * Math.PI * 2;
      const r = 0.06 * length;
      const spike = new THREE.ConeGeometry(0.008 * length, 0.04 * length, 5);
      const spikeMat = new THREE.MeshPhysicalMaterial({
        color: '#ffd700',
        metalness: 0.9,
        roughness: 0.15,
        clearcoat: 1.0
      });
      const spikeMesh = new THREE.Mesh(spike, spikeMat);
      spikeMesh.position.set(
        Math.cos(angle) * r,
        length * 0.16,
        -length * 0.28 + Math.sin(angle) * r * 0.4
      );
      group.add(spikeMesh);
    }
    // 冠輪
    const ringGeo = new THREE.TorusGeometry(0.06 * length, 0.006 * length, 8, 24);
    const ringMat = new THREE.MeshPhysicalMaterial({ color: '#ffd700', metalness: 0.9, roughness: 0.15 });
    const ringMesh = new THREE.Mesh(ringGeo, ringMat);
    ringMesh.rotation.x = Math.PI / 2;
    ringMesh.position.set(0, length * 0.14, -length * 0.28);
    group.add(ringMesh);
  }

  if (special === 'ghost') {
    // 全体半透明+淡いemissive
    if (bodyMat) {
      bodyMat.transparent = true;
      bodyMat.opacity = 0.55;
      bodyMat.emissive = new THREE.Color('#aaddff');
      bodyMat.emissiveIntensity = 0.25;
    }
  }
}

// ── メイン生成関数 ────────────────────────────────────────────────────

function FishCreateMesh(species, sizeCm) {
  const m = species.model;
  const profile = m.profile || 'standard';
  const length = sizeCm / 100; // 1unit=1m
  const group = new THREE.Group();
  group.name = 'fish_' + species.id;

  const isSquid = (profile === 'squid');

  // カラー
  const c = m.colors;
  const bodyColor   = new THREE.Color(c.base);
  const finColor    = new THREE.Color(c.fins);

  // テクスチャ(squid以外)
  let bodyTex = null;
  if (!isSquid && typeof document !== 'undefined') {
    try { bodyTex = _fishMakeTexture(species); } catch(e) {}
  }

  // ボディマテリアル(スウェイ用)
  const bodyMat = new THREE.MeshPhysicalMaterial({
    color: bodyColor,
    map: bodyTex,
    roughness: 0.35,
    metalness: m.sheen * 0.5,
    clearcoat: 0.6,
    clearcoatRoughness: 0.3,
    envMapIntensity: m.sheen > 0.5 ? 1.5 : 0.8
  });
  _fishInjectSway(bodyMat);

  let bodyMesh = null;

  if (isSquid) {
    // イカ: 外套膜+脚
    const squidResult = _fishMakeSquidBody(m, length, c);
    group.add(squidResult.group);
    bodyMesh = squidResult.mantleMesh;

    // squid は触手自体もスウェイ対象(外套膜のみ)
    _fishApplySpecial(group, m.special, length, squidResult.mantleMesh.material);

  } else {
    // 通常魚: 胴体BufferGeometry
    const bodyGeo = _fishMakeBodyGeometry(m, length);
    bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
    bodyMesh.castShadow = true;
    bodyMesh.receiveShadow = true;
    group.add(bodyMesh);

    // 背鰭
    if (m.dorsal) {
      const d = m.dorsal;
      const dw = (d.end - d.start) * length;
      const dh = d.h * length;
      const dShape = _fishFinShape('dorsal', dw, dh, d.spiny);
      const dMesh = _fishMakeFin(dShape, 0.003 * length, finColor, 0.85);
      // 背鰭は体の上面(y>0)の位置
      dMesh.position.set(0, length * m.bodyH * 0.72, ((d.start + d.end) * 0.5 - 0.5) * length);
      dMesh.rotation.x = -Math.PI / 2;
      dMesh.rotation.z = -Math.PI / 2;
      group.add(dMesh);
    }

    // 臀鰭
    if (m.anal) {
      const a = m.anal;
      const aw = (a.end - a.start) * length;
      const ah = a.h * length;
      const aShape = _fishFinShape('anal', aw, ah, false);
      const aMesh = _fishMakeFin(aShape, 0.003 * length, finColor, 0.80);
      aMesh.position.set(0, -length * m.bodyH * 0.55, ((a.start + a.end) * 0.5 - 0.5) * length);
      aMesh.rotation.x = -Math.PI / 2;
      aMesh.rotation.z = -Math.PI / 2;
      group.add(aMesh);
    }

    // 胸鰭 (両側)
    if (m.pectoral) {
      const pw = m.pectoral * length;
      const ph = pw * 0.75;
      const pShape = _fishFinShape('pectoral', pw, ph, false);
      for (let side = -1; side <= 1; side += 2) {
        const pMesh = _fishMakeFin(pShape, 0.003 * length, finColor, 0.80);
        pMesh.position.set(
          side * length * m.bodyW * 0.9,
          0,
          -length * 0.26
        );
        pMesh.rotation.y = side * (Math.PI * 0.5 + Math.PI * 0.08);
        group.add(pMesh);
      }
    }

    // 尾鰭
    {
      const tw = length * m.bodyH * 1.1;
      const th = length * m.bodyH * 1.3;
      const tShape = _fishTailShape(m.tail, tw * 0.5, th);
      const tMesh = _fishMakeFin(tShape, 0.004 * length, finColor, 0.88);
      // 体軸後端(z=+length*0.5付近)に配置、XZ平面で左右対称
      tMesh.position.set(-tw * 0.25, -th * 0.45, length * 0.46);
      tMesh.rotation.x = -Math.PI / 2;
      group.add(tMesh);
    }

    // flat プロファイル: 両目を上面に
    const isFlat = (profile === 'flat');
    const eyeRadius = length * 0.04;

    if (isFlat) {
      // 両目ともy>0 上面、左右に寄せる
      for (let side = -1; side <= 1; side += 2) {
        const eyeGrp = _fishMakeEye(c.eye, eyeRadius);
        eyeGrp.position.set(
          side * length * m.bodyW * 0.32,
          length * m.bodyH * 0.38,
          -length * 0.30
        );
        group.add(eyeGrp);
      }
    } else {
      // 通常魚: 左右両側に目
      for (let side = -1; side <= 1; side += 2) {
        const eyeGrp = _fishMakeEye(c.eye, eyeRadius);
        eyeGrp.position.set(
          side * length * m.bodyW * 0.92,
          length * m.bodyH * 0.18,
          -length * 0.35
        );
        group.add(eyeGrp);
      }
    }

    // special 演出
    _fishApplySpecial(group, m.special, length, bodyMat);
  }

  // eel プロファイル: 連続背鰭ライン(背鰭を長く展開)
  if (profile === 'eel' && m.dorsal) {
    const d = m.dorsal;
    const ew = (0.90 - 0.12) * length; // eel は全長にわたる
    const eh = d.h * length * 0.7;
    const eShape = _fishFinShape('dorsal', ew, eh, false);
    const eMesh = _fishMakeFin(eShape, 0.002 * length, finColor, 0.75);
    eMesh.position.set(0, length * m.bodyH * 0.55, (0.12 + 0.90) * 0.5 * length - length * 0.5);
    eMesh.rotation.x = -Math.PI / 2;
    eMesh.rotation.z = -Math.PI / 2;
    group.add(eMesh);
  }

  // userData: update関数(スウェイuniform更新)
  group.userData.update = function(t) {
    if (bodyMat && bodyMat.userData && bodyMat.userData.uTime) {
      bodyMat.userData.uTime.value = t;
    }
  };

  _FishRegistry.add(group);
  return group;
}

// ── 全個体アニメ更新 ──────────────────────────────────────────────────

function FishUpdateAll(t) {
  _FishRegistry.forEach(function(group) {
    if (group.userData && typeof group.userData.update === 'function') {
      group.userData.update(t);
    }
  });
}

// ── 破棄 ──────────────────────────────────────────────────────────────

function FishDispose(group) {
  _FishRegistry.delete(group);

  group.traverse(function(obj) {
    if (obj.isMesh) {
      if (obj.geometry) {
        obj.geometry.dispose();
      }
      if (obj.material) {
        const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
        mats.forEach(function(mat) {
          if (mat.map) mat.map.dispose();
          if (mat.clearcoatMap) mat.clearcoatMap.dispose();
          if (mat.emissiveMap) mat.emissiveMap.dispose();
          mat.dispose();
        });
      }
    }
  });

  // テクスチャキャッシュは共有のため群体ごとには消さない
  // 必要に応じて FishDisposeCache() を別途呼ぶ
}

// ── キャッシュ全クリア ────────────────────────────────────────────────

function FishDisposeCache() {
  _FishTexCache.forEach(function(tex) { tex.dispose(); });
  _FishTexCache.clear();
}


//============== 02_ocean.js ==============
// 02_ocean.js — 海面・空・環境(磯場)
// トップレベル宣言は Env* / Ocean* 接頭辞のみ

// ============================================================
// Gerstner 波パラメータ (JS側 / GLSL側で共有する定数)
// direction は正規化済み
// ============================================================
var OceanWaves = (function() {
  function normalize2(x, z) {
    var len = Math.sqrt(x * x + z * z);
    return [x / len, z / len];
  }
  var d1 = normalize2(0.8, 0.6);
  var d2 = normalize2(0.5, -0.7);
  var d3 = normalize2(-0.3, 0.9);
  var d4 = normalize2(0.9, 0.4);
  var d5 = normalize2(-0.6, 0.8);
  return [
    { wavelength: 80,  amplitude: 1.20, dx: d1[0], dz: d1[1], speed: 3.0 },
    { wavelength: 40,  amplitude: 0.60, dx: d2[0], dz: d2[1], speed: 4.0 },
    { wavelength: 30,  amplitude: 0.40, dx: d3[0], dz: d3[1], speed: 3.5 },
    { wavelength: 10,  amplitude: 0.12, dx: d4[0], dz: d4[1], speed: 6.0 },
    { wavelength:  6,  amplitude: 0.06, dx: d5[0], dz: d5[1], speed: 7.0 }
  ];
})();

// ============================================================
// GLSL: Gerstner 波ブロック (頂点シェーダ内で展開)
// ============================================================
var OceanVertexShader = [
  'uniform float uTime;',
  'uniform vec3 uSunDir;',
  'varying vec3 vWorldPos;',
  'varying vec3 vNormal;',
  'varying float vHeight;',
  'varying float vFoam;',
  '',
  'const int WAVE_COUNT = 5;',
  'float waveLen[WAVE_COUNT];',
  'float waveAmp[WAVE_COUNT];',
  'vec2  waveDir[WAVE_COUNT];',
  'float waveSpd[WAVE_COUNT];',
  '',
  'void initWaves() {',
  '  waveLen[0]=80.0; waveAmp[0]=1.20; waveDir[0]=normalize(vec2(0.8, 0.6)); waveSpd[0]=3.0;',
  '  waveLen[1]=40.0; waveAmp[1]=0.60; waveDir[1]=normalize(vec2(0.5,-0.7)); waveSpd[1]=4.0;',
  '  waveLen[2]=30.0; waveAmp[2]=0.40; waveDir[2]=normalize(vec2(-0.3,0.9)); waveSpd[2]=3.5;',
  '  waveLen[3]=10.0; waveAmp[3]=0.12; waveDir[3]=normalize(vec2(0.9, 0.4)); waveSpd[3]=6.0;',
  '  waveLen[4]= 6.0; waveAmp[4]=0.06; waveDir[4]=normalize(vec2(-0.6,0.8)); waveSpd[4]=7.0;',
  '}',
  '',
  'vec3 gerstner(vec3 pos) {',
  '  initWaves();',
  '  vec3 p = pos;',
  '  for (int i = 0; i < WAVE_COUNT; i++) {',
  '    float k = 6.28318 / waveLen[i];',
  '    float w = waveSpd[i] * k;',
  '    float phase = k * dot(waveDir[i], vec2(pos.x, pos.z)) - w * uTime;',
  '    float Q = 0.5 / (waveAmp[i] * k * float(WAVE_COUNT));',
  '    p.x += Q * waveAmp[i] * waveDir[i].x * cos(phase);',
  '    p.z += Q * waveAmp[i] * waveDir[i].y * cos(phase);',
  '    p.y += waveAmp[i] * sin(phase);',
  '  }',
  '  return p;',
  '}',
  '',
  'vec3 gerstnerNormal(vec3 pos) {',
  '  initWaves();',
  '  float dydx = 0.0;',
  '  float dydz = 0.0;',
  '  float dxdx = 1.0;',
  '  float dzdz = 1.0;',
  '  for (int i = 0; i < WAVE_COUNT; i++) {',
  '    float k = 6.28318 / waveLen[i];',
  '    float w = waveSpd[i] * k;',
  '    float phase = k * dot(waveDir[i], vec2(pos.x, pos.z)) - w * uTime;',
  '    float Q = 0.5 / (waveAmp[i] * k * float(WAVE_COUNT));',
  '    float WA = waveAmp[i] * k;',
  '    float sinP = sin(phase);',
  '    float cosP = cos(phase);',
  '    dydx += WA * waveDir[i].x * cosP;',
  '    dydz += WA * waveDir[i].y * cosP;',
  '    dxdx -= Q * WA * waveDir[i].x * waveDir[i].x * sinP;',
  '    dzdz -= Q * WA * waveDir[i].y * waveDir[i].y * sinP;',
  '  }',
  '  return normalize(vec3(-dydx, 1.0, -dydz));',
  '}',
  '',
  'void main() {',
  '  vec3 pos = position;',
  '  vec3 displaced = gerstner(pos);',
  '  vHeight = displaced.y;',
  '  vNormal = gerstnerNormal(pos);',
  '  vWorldPos = displaced;',
  '  // foam: 高さ > threshold かつ法線傾きが急峻',
  '  float foamH = step(0.7, displaced.y);',
  '  float foamN = step(0.7, 1.0 - vNormal.y);',
  '  vFoam = foamH * foamN;',
  '  gl_Position = projectionMatrix * modelViewMatrix * vec4(displaced, 1.0);',
  '}'
].join('\n');

var OceanFragmentShader = [
  'uniform float uTime;',
  'uniform vec3 uSunDir;',
  'uniform vec3 uSunColor;',
  'uniform vec3 uSkyColor;',
  'uniform vec3 uFogColor;',
  'uniform float uFogDensity;',
  'varying vec3 vWorldPos;',
  'varying vec3 vNormal;',
  'varying float vHeight;',
  'varying float vFoam;',
  '',
  'void main() {',
  '  vec3 N = normalize(vNormal);',
  '  vec3 V = normalize(cameraPosition - vWorldPos);',
  '',
  '  // 深い藍緑 → 浅瀬グラデーション',
  '  vec3 deepColor    = vec3(0.02, 0.10, 0.22);',
  '  vec3 shallowColor = vec3(0.05, 0.28, 0.38);',
  '  float depthBlend = clamp((vHeight + 1.5) / 3.0, 0.0, 1.0);',
  '  vec3 baseColor = mix(deepColor, shallowColor, depthBlend);',
  '',
  '  // フレネル反射',
  '  float fresnel = pow(1.0 - max(dot(N, V), 0.0), 4.0);',
  '  baseColor = mix(baseColor, uSkyColor, fresnel * 0.65);',
  '',
  '  // 太陽スペキュラ (Blinn-Phong)',
  '  vec3 H = normalize(uSunDir + V);',
  '  float spec = pow(max(dot(N, H), 0.0), 256.0);',
  '  vec3 specColor = uSunColor * spec * 2.5;',
  '',
  '  // 拡散光',
  '  float diff = max(dot(N, uSunDir), 0.0);',
  '  vec3 litColor = baseColor * (0.3 + 0.7 * diff) + specColor;',
  '',
  '  // 波頭の泡',
  '  litColor = mix(litColor, vec3(0.95, 0.97, 1.0), vFoam * 0.85);',
  '',
  '  // 距離フォグ',
  '  float dist = length(vWorldPos - cameraPosition);',
  '  float fogFactor = 1.0 - exp(-uFogDensity * uFogDensity * dist * dist);',
  '  litColor = mix(litColor, uFogColor, clamp(fogFactor, 0.0, 1.0));',
  '',
  '  gl_FragColor = vec4(litColor, 0.92);',
  '}'
].join('\n');

// ============================================================
// 空シェーダ
// ============================================================
var OceanSkyVertexShader = [
  'varying vec3 vWorldDir;',
  'void main() {',
  '  vWorldDir = normalize((modelMatrix * vec4(position, 0.0)).xyz);',
  '  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);',
  '}'
].join('\n');

var OceanSkyFragmentShader = [
  'uniform vec3 uSunDir;',
  'uniform vec3 uZenithColor;',
  'uniform vec3 uHorizonColor;',
  'uniform vec3 uGroundColor;',
  'uniform vec3 uSunColor;',
  'uniform float uStarIntensity;',
  'varying vec3 vWorldDir;',
  '',
  'float hash(vec2 p) {',
  '  return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);',
  '}',
  '',
  'void main() {',
  '  vec3 dir = normalize(vWorldDir);',
  '  float elevation = dir.y;',
  '',
  '  // グラデーション',
  '  vec3 skyColor;',
  '  if (elevation >= 0.0) {',
  '    float t = pow(elevation, 0.5);',
  '    skyColor = mix(uHorizonColor, uZenithColor, t);',
  '  } else {',
  '    skyColor = mix(uHorizonColor, uGroundColor, min(-elevation * 5.0, 1.0));',
  '  }',
  '',
  '  // 太陽グロー',
  '  float sunDot = dot(dir, normalize(uSunDir));',
  '  float sunGlow = smoothstep(0.96, 1.0, sunDot);',
  '  float sunHalo = pow(max(sunDot, 0.0), 8.0) * 0.3;',
  '  skyColor += uSunColor * (sunGlow * 3.0 + sunHalo);',
  '',
  '  // 星',
  '  if (uStarIntensity > 0.0) {',
  '    vec2 starUV = vec2(atan(dir.z, dir.x) * 0.1591, asin(dir.y) * 0.3183);',
  '    vec2 cell = floor(starUV * 120.0);',
  '    float starVal = hash(cell);',
  '    float starBright = step(0.985, starVal);',
  '    float twinkle = hash(cell + vec2(0.1, 0.2));',
  '    skyColor += vec3(starBright * twinkle * uStarIntensity);',
  '  }',
  '',
  '  gl_FragColor = vec4(skyColor, 1.0);',
  '}'
].join('\n');

// ============================================================
// 疑似ノイズ (sin ベース fBm 風)
// ============================================================
function OceanNoiseSimple(x, y, z) {
  var s = Math.sin(x * 1.7 + y * 2.3 + z * 0.9) * 0.5
        + Math.sin(x * 3.1 - y * 1.5 + z * 2.7) * 0.25
        + Math.sin(x * 5.3 + y * 4.1 - z * 3.3) * 0.125
        + Math.sin(x * 9.7 - y * 8.3 + z * 7.1) * 0.0625;
  return s / 0.9375;
}

function OceanFbm(x, y, z, octaves) {
  var val = 0.0, amp = 1.0, freq = 1.0, max = 0.0;
  for (var i = 0; i < octaves; i++) {
    val += OceanNoiseSimple(x * freq, y * freq, z * freq) * amp;
    max += amp;
    amp  *= 0.5;
    freq *= 2.1;
  }
  return val / max;
}

// ============================================================
// 磯の岩生成
// ============================================================
function OceanCreateRock(radius, detail, px, py, pz, scaleY) {
  var geo = new THREE.IcosahedronGeometry(radius, detail);
  var pos = geo.attributes.position;
  var count = pos.count;
  var colors = new Float32Array(count * 3);

  for (var i = 0; i < count; i++) {
    var x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    var noise = OceanFbm(x * 0.4, y * 0.4, z * 0.4, 4);
    var disp = 1.0 + noise * 0.45;
    pos.setXYZ(i, x * disp, y * disp * scaleY, z * disp);

    var yN = y * scaleY * disp;
    var wet = Math.max(0.0, Math.min(1.0, (0.3 - yN) * 2.0));
    var r = 0.45 + (1.0 - wet) * 0.25;
    var g = 0.48 + (1.0 - wet) * 0.22;
    var b = 0.42 + (1.0 - wet) * 0.20 + wet * 0.15;
    colors[i * 3]     = r;
    colors[i * 3 + 1] = g;
    colors[i * 3 + 2] = b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geo.computeVertexNormals();

  var mat = new THREE.MeshStandardMaterial({
    vertexColors: true,
    roughness: 0.82,
    metalness: 0.05
  });
  var mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(px, py, pz);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

// ============================================================
// テトラポッド風オブジェクト

function OceanCreateTetrapod(px, py, pz) {
  var group = new THREE.Group();
  var mat = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.9 });
  var angles = [
    [0, 0, 0],
    [Math.PI * 0.5, 0, 0],
    [0, 0, Math.PI * 0.5],
    [Math.PI * 0.33, Math.PI * 0.33, 0]
  ];
  for (var i = 0; i < angles.length; i++) {
    var geo = new THREE.CylinderGeometry(0.12, 0.18, 1.1, 8);
    var mesh = new THREE.Mesh(geo, mat);
    mesh.rotation.set(angles[i][0], angles[i][1], angles[i][2]);
    mesh.castShadow = true;
    group.add(mesh);
  }
  group.position.set(px, py, pz);
  return group;
}

// ============================================================
// 灯台
// ============================================================
function OceanCreateLighthouse(px, py, pz) {
  var group = new THREE.Group();

  // 塔
  var towerGeo = new THREE.CylinderGeometry(0.8, 1.2, 8, 12);
  var towerMat = new THREE.MeshStandardMaterial({ color: 0xddd8cc, roughness: 0.7 });
  var tower = new THREE.Mesh(towerGeo, towerMat);
  tower.position.y = 4;
  tower.castShadow = true;
  group.add(tower);

  // 縞模様 (リング)
  var stripeMat = new THREE.MeshStandardMaterial({ color: 0xcc3322, roughness: 0.7 });
  for (var i = 0; i < 3; i++) {
    var ringGeo = new THREE.CylinderGeometry(1.05, 1.05, 0.4, 12);
    var ring = new THREE.Mesh(ringGeo, stripeMat);
    ring.position.y = 1.5 + i * 2.5;
    group.add(ring);
  }

  // ランプハウス
  var lampGeo = new THREE.CylinderGeometry(1.0, 1.0, 1.2, 12);
  var lampMat = new THREE.MeshStandardMaterial({ color: 0x88aacc, roughness: 0.3, metalness: 0.5, transparent: true, opacity: 0.7 });
  var lamp = new THREE.Mesh(lampGeo, lampMat);
  lamp.position.y = 8.6;
  group.add(lamp);

  // 屋根
  var roofGeo = new THREE.ConeGeometry(1.2, 1.0, 12);

// 海中表現 (半透明平面)
// ============================================================
function OceanCreateUnderwaterPlane() {
  var geo = new THREE.PlaneGeometry(180, 180);
  geo.rotateX(-Math.PI / 2);
  var mat = new THREE.MeshBasicMaterial({
    color: 0x021520,
    transparent: true,
    opacity: 0.55,
    depthWrite: false,
    side: THREE.DoubleSide
  });
  var mesh = new THREE.Mesh(geo, mat);
  mesh.position.y = -0.5;
  return mesh;

// ============================================================
// カモメ
// ============================================================
function OceanCreateSeagull() {
  var group = new THREE.Group();

  // 胴体
  var bodyGeo = new THREE.SphereGeometry(0.18, 8, 6);
  bodyGeo.scale(1.8, 0.7, 0.9);
  var bodyMat = new THREE.MeshStandardMaterial({ color: 0xfafafa, roughness: 0.8 });
  var body = new THREE.Mesh(bodyGeo, bodyMat);
  group.add(body);

  // 翼 (左右)
  var wingShape = new THREE.Shape();
  wingShape.moveTo(0, 0);
  wingShape.quadraticCurveTo(0.6, 0.15, 1.4, 0.05);
  wingShape.quadraticCurveTo(1.0, -0.05, 0.3, -0.18);
  wingShape.quadraticCurveTo(0.1, -0.1, 0, 0);

  var extrudeSettings = { depth: 0.04, bevelEnabled: false };
  var wingGeo = new THREE.ExtrudeGeometry(wingShape, extrudeSettings);
  var wingMat = new THREE.MeshStandardMaterial({ color: 0xf0f0f0, roughness: 0.8, side: THREE.DoubleSide });

  var wingL = new THREE.Mesh(wingGeo, wingMat);
  wingL.position.set(0, 0, 0);
  group.add(wingL);

  var wingRGeo = new THREE.ExtrudeGeometry(wingShape, extrudeSettings);
  var wingR = new THREE.Mesh(wingRGeo, wingMat);
  wingR.scale.z = -1;
  wingR.position.set(0, 0, 0.04);
  group.add(wingR);

  // 翼への参照を保存
  group.userData.wingL = wingL;
  group.userData.wingR = wingR;

  return group;
}

// ============================================================
// 主要エントリポイント: EnvCreate
// ============================================================
function EnvCreate(scene, renderer) {

  // --- レンダラーシャドウ設定 ---
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  // === 内部状態 ===
  var _sunDir = new THREE.Vector3(0.5, 0.8, 0.3).normalize();
  var _sunColor = new THREE.Color(1.0, 0.95, 0.8);
  var _skyColor = new THREE.Color(0.4, 0.7, 1.0);
  var _fogColor = new THREE.Color(0.6, 0.75, 0.9);
  var _currentP = 0.0;

  // === 霧 ===
  scene.fog = new THREE.FogExp2(_fogColor.getHex(), 0.008);

  // ============================================================
  // 海面メッシュ
  // ============================================================
  var waterGeo = new THREE.PlaneGeometry(200, 200, 256, 256);
  waterGeo.rotateX(-Math.PI / 2);

  var waterUniforms = {
    uTime:       { value: 0.0 },
    uSunDir:     { value: _sunDir.clone() },
    uSunColor:   { value: new THREE.Vector3(1.0, 0.95, 0.8) },
    uSkyColor:   { value: new THREE.Vector3(0.4, 0.7, 1.0) },
    uFogColor:   { value: new THREE.Vector3(0.6, 0.75, 0.9) },
    uFogDensity: { value: 0.008 }
  };

  var waterMat = new THREE.ShaderMaterial({
    uniforms:       waterUniforms,
    vertexShader:   OceanVertexShader,
    fragmentShader: OceanFragmentShader,
    transparent:    true,
    side:           THREE.FrontSide
  });

  var water = new THREE.Mesh(waterGeo, waterMat);
  water.receiveShadow = true;
  scene.add(water);

  // ============================================================
  // 空ドーム
  // ============================================================
  var skyGeo = new THREE.SphereGeometry(500, 32, 16);
  var skyUniforms = {
    uSunDir:        { value: _sunDir.clone() },
    uZenithColor:   { value: new THREE.Vector3(0.1, 0.35, 0.8) },
    uHorizonColor:  { value: new THREE.Vector3(0.6, 0.78, 0.95) },
    uGroundColor:   { value: new THREE.Vector3(0.25, 0.22, 0.18) },
    uSunColor:      { value: new THREE.Vector3(1.0, 0.9, 0.7) },
    uStarIntensity: { value: 0.0 }
  };
  var skyMat = new THREE.ShaderMaterial({
    uniforms:       skyUniforms,
    vertexShader:   OceanSkyVertexShader,
    fragmentShader: OceanSkyFragmentShader,
    side:           THREE.BackSide
  });
  var skyMesh = new THREE.Mesh(skyGeo, skyMat);
  scene.add(skyMesh);

  // ============================================================
  // 照明
  // ============================================================
  var sunLight = new THREE.DirectionalLight(0xfff5e0, 2.0);
  sunLight.castShadow = true;
  sunLight.shadow.mapSize.width  = 2048;
  sunLight.shadow.mapSize.height = 2048;
  sunLight.shadow.camera.near = 0.5;
  sunLight.shadow.camera.far  = 500;
  sunLight.shadow.camera.left   = -60;
  sunLight.shadow.camera.right  =  60;
  sunLight.shadow.camera.top    =  60;
  sunLight.shadow.camera.bottom = -60;
  sunLight.position.copy(_sunDir).multiplyScalar(100);
  scene.add(sunLight);

  var hemiLight = new THREE.HemisphereLight(0x88aacc, 0x445566, 0.6);
  scene.add(hemiLight);

  var ambientLight = new THREE.AmbientLight(0x223344, 0.3);
  scene.add(ambientLight);

  // ============================================================
  // 磯場
  // ============================================================
  // 主岩
  var rock1 = OceanCreateRock(2.2, 3,  0.0, -0.5, -2.0, 0.55);
  var rock2 = OceanCreateRock(1.6, 3,  2.5, -0.8, -0.5, 0.60);
  var rock3 = OceanCreateRock(1.3, 3, -2.0, -0.7,  0.5, 0.58);
  var rock4 = OceanCreateRock(0.9, 3,  1.2, -0.6,  1.8, 0.65);
  scene.add(rock1);
  scene.add(rock2);
  scene.add(rock3);
  scene.add(rock4);

  // 小岩
  var smallRockData = [
    [0.5, 2, -3.5, 0.0, -1.0, 0.7],
    [0.4, 2,  3.8, 0.1, -3.5, 0.6],
    [0.35, 2, -1.5, 0.0, 2.5, 0.75],
    [0.45, 2,  4.5, -0.1, 1.0, 0.65]
  ];
  for (var sri = 0; sri < smallRockData.length; sri++) {
    var sd = smallRockData[sri];
    scene.add(OceanCreateRock(sd[0], sd[1], sd[2], sd[3], sd[4], sd[5]));
  }

  // テトラポッド
  scene.add(OceanCreateTetrapod(-4.5, 0.0, -3.0));
  scene.add(OceanCreateTetrapod( 5.0, 0.1, -4.5));
  scene.add(OceanCreateTetrapod(-6.0, 0.0,  2.0));

  // 遠景シルエット
  scene.add(OceanCreateDistantSilhouette());

  // 灯台
  scene.add(OceanCreateLighthouse(120, 0.0, -80));

  // 海中平面
  scene.add(OceanCreateUnderwaterPlane());

  // ============================================================
  // カモメ
  // ============================================================
  var seagulls = [];
  var seagullData = [
    { radius: 35, speed: 0.22, yBase: 12, wingSpeed: 3.0, offset: 0.0,   phase: 0.0 },
    { radius: 48, speed: 0.15, yBase: 18, wingSpeed: 2.5, offset: 2.1,   phase: Math.PI * 0.66 },
    { radius: 30, speed: 0.28, yBase:  9, wingSpeed: 3.5, offset: 1.3,   phase: Math.PI * 1.33 }
  ];
  for (var sgi = 0; sgi < seagullData.length; sgi++) {
    var gull = OceanCreateSeagull();
    scene.add(gull);
    seagulls.push({ mesh: gull, data: seagullData[sgi] });
  }

  // ============================================================
  // 再利用ベクトル (毎フレームの new 回避)
  // ============================================================
  var _tmpSunVec3 = new THREE.Vector3();
  var _tmpSunColorVec = new THREE.Vector3();
  var _tmpSkyColorVec = new THREE.Vector3();
  var _tmpFogColorVec = new THREE.Vector3();

  // ============================================================
  // setTimeOfDay
  // ============================================================
  function EnvSetTimeOfDay(p) {
    _currentP = p;

    // 太陽 elevation: p=0→30°, p=0.25→70°, p=0.5→5°, p=0.75→-20°, p=1→30°
    var elevation, azimuth;
    azimuth = 0.3; // 固定 azimuth

    if (p < 0.25) {
      // 朝 (0→0.25)
      var t = p / 0.25;
      elevation = 0.3 + t * 0.9; // 0.3rad→1.2rad
    } else if (p < 0.5) {
      // 昼→夕方 (0.25→0.5)
      var t = (p - 0.25) / 0.25;
      elevation = 1.2 - t * 1.1; // 1.2→0.1
    } else if (p < 0.75) {
      // 夕方→夜 (0.5→0.75)
      var t = (p - 0.5) / 0.25;
      elevation = 0.1 - t * 0.55; // 0.1→-0.45
    } else {
      // 夜→朝前 (0.75→1.0)
      var t = (p - 0.75) / 0.25;
      elevation = -0.45 + t * 0.75; // -0.45→0.3
    }

    _sunDir.set(
      Math.cos(elevation) * Math.sin(azimuth),
      Math.sin(elevation),
      Math.cos(elevation) * Math.cos(azimuth)
    ).normalize();

    // 色の計算
    var dawn = Math.max(0, Math.min(1, 1 - Math.abs(p - 0.0) * 8));
    var noon = Math.max(0, Math.min(1, 1 - Math.abs(p - 0.25) * 6));
    var dusk = Math.max(0, Math.min(1, 1 - Math.abs(p - 0.5) * 8));
    var night = Math.max(0, Math.min(1, 1 - Math.abs(p - 0.75) * 6));
    var total = dawn + noon + dusk + night + 0.001;

    // 太陽色
    var sr = (dawn * 1.0 + noon * 1.0 + dusk * 1.0 + night * 0.1) / total;
    var sg = (dawn * 0.75 + noon * 0.95 + dusk * 0.45 + night * 0.1) / total;
    var sb = (dawn * 0.55 + noon * 0.8 + dusk * 0.2 + night * 0.15) / total;
    _sunColor.setRGB(sr, sg, sb);
    sunLight.color.setRGB(sr, sg, sb);

    // 太陽強度
    var sunIntensity = Math.max(0.0, Math.sin(elevation));
    sunLight.intensity = 0.1 + sunIntensity * 2.2;
    sunLight.position.copy(_sunDir).multiplyScalar(100);

    // 空の天頂色
    var zenithR = (dawn * 0.55 + noon * 0.15 + dusk * 0.25 + night * 0.02) / total;
    var zenithG = (dawn * 0.72 + noon * 0.42 + dusk * 0.18 + night * 0.03) / total;
    var zenithB = (dawn * 0.88 + noon * 0.95 + dusk * 0.35 + night * 0.12) / total;

    // 地平色
    var horizR = (dawn * 0.95 + noon * 0.55 + dusk * 0.88 + night * 0.08) / total;
    var horizG = (dawn * 0.75 + noon * 0.72 + dusk * 0.35 + night * 0.08) / total;
    var horizB = (dawn * 0.65 + noon * 0.90 + dusk * 0.22 + night * 0.15) / total;

    _skyColor.setRGB(horizR, horizG, horizB);

    skyUniforms.uSunDir.value.copy(_sunDir);
    skyUniforms.uZenithColor.value.set(zenithR, zenithG, zenithB);
    skyUniforms.uHorizonColor.value.set(horizR, horizG, horizB);
    skyUniforms.uSunColor.value.set(sr * 1.5, sg * 1.2, sb * 0.8);
    skyUniforms.uStarIntensity.value = night * 0.9;

    // 海面 uniform 更新
    waterUniforms.uSunDir.value.copy(_sunDir);
    waterUniforms.uSunColor.value.set(sr, sg, sb);
    waterUniforms.uSkyColor.value.set(horizR, horizG, horizB);

    // フォグ色
    var fogR = (dawn * 0.75 + noon * 0.62 + dusk * 0.65 + night * 0.08) / total;
    var fogG = (dawn * 0.80 + noon * 0.75 + dusk * 0.42 + night * 0.09) / total;
    var fogB = (dawn * 0.85 + noon * 0.90 + dusk * 0.32 + night * 0.15) / total;
    waterUniforms.uFogColor.value.set(fogR, fogG, fogB);

    if (scene.fog) {
      scene.fog.color.setRGB(fogR, fogG, fogB);
    }

    // ヘミライト更新
    var skyLum = zenithR * 0.3 + zenithG * 0.59 + zenithB * 0.11;
    hemiLight.color.setRGB(horizR * 0.5, horizG * 0.55, horizB * 0.65);
    hemiLight.groundColor.setRGB(0.2, 0.18, 0.15);
    hemiLight.intensity = 0.2 + skyLum * 0.6;
  }

  // 初期値を適用
  EnvSetTimeOfDay(0.22); // 朝

  // ============================================================
  // update
  // ============================================================
  function EnvUpdate(t, dt) {
    // 海面時間
    waterUniforms.uTime.value = t;

    // カモメ更新
    for (var i = 0; i < seagulls.length; i++) {
      var sg2 = seagulls[i];
      var d = sg2.data;
      var angle = d.phase + t * d.speed;
      sg2.mesh.position.set(
        Math.cos(angle) * d.radius,
        d.yBase + Math.sin(t * 0.4 + d.offset) * 1.5,
        Math.sin(angle) * d.radius
      );
      sg2.mesh.rotation.y = -angle - Math.PI * 0.5;

      // 羽ばたき
      var flapAngle = Math.sin(t * d.wingSpeed + d.offset) * 0.5;
      if (sg2.mesh.userData.wingL) {
        sg2.mesh.userData.wingL.rotation.z = flapAngle;
      }
      if (sg2.mesh.userData.wingR) {
        sg2.mesh.userData.wingR.rotation.z = -flapAngle;
      }
    }
  }

  // ============================================================
  // getWaveHeight — CPU 側 Gerstner 実装 (シェーダと同一係数)
  // ============================================================
  function EnvGetWaveHeight(x, z, t) {
    var y = 0.0;
    var px = x, pz = z;
    for (var i = 0; i < OceanWaves.length; i++) {
      var w = OceanWaves[i];
      var k = (2.0 * Math.PI) / w.wavelength;
      var omega = w.speed * k;
      var phase = k * (w.dx * px + w.dz * pz) - omega * t;
      y += w.amplitude * Math.sin(phase);
    }
    return y;
  }

  // ============================================================
  // env オブジェクトを返す
  // ============================================================
  return {
    water:      water,
    sunLight:   sunLight,
    standY:     1.0,
    update:     EnvUpdate,
    getWaveHeight: EnvGetWaveHeight,
    setTimeOfDay:  EnvSetTimeOfDay
  };
}

/* ============================================================
   05_ui.js — UIController
   チヌ釣り三昧 UI 全実装
   import/export 禁止。トップレベル接頭辞: UI*
   ============================================================ */

/* ---------- SVGシルエット生成ヘルパー ---------- */

/**
 * 魚種の model.profile / model.tail などから簡易 SVG パス文字列を生成。
 * @param {object} species  SPECIES エントリ
 * @param {boolean} filled  未捕獲=true(グレー塗りつぶし)
 * @param {number} w 横幅px
 * @param {number} h 縦幅px
 * @returns {string} <svg>…</svg> 文字列
 */
function UIBuildFishSVG(species, filled, w, h) {
  w = w || 80;
  h = h || 52;
  var m = (species && species.model) ? species.model : {};
  var profile = m.profile || 'standard';
  var tail    = m.tail    || 'forked';
  var bodyH   = m.bodyH  || 0.30;
  var bodyW   = m.bodyW  || 0.13;
  var isCat   = species && species.category === 'fantasy';

  // 輪郭色
  var strokeColor = filled ? '#666' : (isCat ? '#a03cdc' : '#44aa77');
  var fillColor   = filled ? '#444' : (m.colors ? (m.colors.base || '#6a8fa0') : '#6a8fa0');

  // --- ボディ楕円ベース (cx=w*0.42, cy=h*0.50) ---
  var cx = w * 0.42;
  var cy = h * 0.50;
  var rx = w * 0.34;
  var ry = h * (bodyH * 1.6);
  if (ry < 8) ry = 8;

  // profile別調整
  if (profile === 'deep') { ry *= 1.3; rx *= 0.9; }
  if (profile === 'slender') { ry *= 0.55; rx *= 1.0; }
  if (profile === 'flat') { ry *= 0.75; }
  if (profile === 'eel') { rx *= 1.2; ry *= 0.45; }
  if (profile === 'round') { ry *= 1.15; rx *= 0.88; }
  if (profile === 'squid') { ry *= 1.1; rx *= 0.8; }

  // 吻
  var snoutX = cx + rx + (profile === 'slender' ? w * 0.18 : w * 0.06);
  var snoutY = cy;

  // 尾部基点
  var tailBaseX = cx - rx;

  // 尾ひれ
  var tailPath = '';
  if (profile === 'squid') {
    // イカっぽい
    var t1x = tailBaseX - w * 0.15;
    var t1ya = cy - ry * 0.6;
    var t1yb = cy + ry * 0.6;
    tailPath = 'M ' + tailBaseX + ' ' + (cy - ry * 0.3)
      + ' Q ' + (tailBaseX - w*0.10) + ' ' + t1ya + ' ' + t1x + ' ' + t1ya
      + ' L ' + t1x + ' ' + t1yb
      + ' Q ' + (tailBaseX - w*0.10) + ' ' + t1yb + ' ' + tailBaseX + ' ' + (cy + ry * 0.3)
      + ' Z';
  } else if (tail === 'forked' || tail === 'lunate') {
    var spread = (tail === 'lunate') ? ry * 1.0 : ry * 0.75;
    var notchX = tailBaseX - w * 0.08;
    var tipX   = tailBaseX - w * (tail === 'lunate' ? 0.18 : 0.14);
    tailPath = 'M ' + tailBaseX + ' ' + cy
      + ' Q ' + notchX + ' ' + (cy - spread * 0.5) + ' ' + tipX + ' ' + (cy - spread)
      + ' Q ' + (tailBaseX - w*0.04) + ' ' + cy + ' ' + tailBaseX + ' ' + cy
      + ' Q ' + (tailBaseX - w*0.04) + ' ' + cy + ' ' + tipX + ' ' + (cy + spread)
      + ' Q ' + notchX + ' ' + (cy + spread * 0.5) + ' ' + tailBaseX + ' ' + cy
      + ' Z';
  } else if (tail === 'rounded') {
    var tipXr = tailBaseX - w * 0.10;
    tailPath = 'M ' + tailBaseX + ' ' + (cy - ry * 0.6)
      + ' Q ' + tipXr + ' ' + cy + ' ' + tailBaseX + ' ' + (cy + ry * 0.6)
      + ' Z';
  } else if (tail === 'pointed') {
    var tipXp = tailBaseX - w * 0.14;
    tailPath = 'M ' + tailBaseX + ' ' + (cy - ry * 0.4)
      + ' L ' + tipXp + ' ' + cy
      + ' L ' + tailBaseX + ' ' + (cy + ry * 0.4)
      + ' Z';
  } else {
    // truncate
    tailPath = 'M ' + tailBaseX + ' ' + (cy - ry * 0.65)
      + ' L ' + (tailBaseX - w*0.06) + ' ' + (cy - ry * 0.7)
      + ' L ' + (tailBaseX - w*0.06) + ' ' + (cy + ry * 0.7)
      + ' L ' + tailBaseX + ' ' + (cy + ry * 0.65)
      + ' Z';
  }

  // 背びれ(簡易)
  var dorsalPath = '';
  if (profile !== 'eel' && profile !== 'squid') {
    var dsx = cx + rx * 0.4;
    var dex = cx - rx * 0.1;
    var dTop = cy - ry - h * 0.14;
    dorsalPath = 'M ' + dsx + ' ' + (cy - ry * 0.85)
      + ' Q ' + ((dsx+dex)/2) + ' ' + dTop + ' ' + dex + ' ' + (cy - ry * 0.75)
      + ' Z';
  }

  // 目
  var eyeRad = Math.max(2.5, ry * 0.18);
  var eyeX   = cx + rx * 0.55;
  var eyeY   = cy - ry * 0.12;

  // bodyパス (滑らかな楕円を cubic bezier で描く)
  var kappa = 0.5523;
  var bLeft  = cx - rx;
  var bRight = cx + rx;
  var bTop   = cy - ry;
  var bBot   = cy + ry;
  // 四隅制御点
  var cpH = rx * kappa;
  var cpV = ry * kappa;
  var bodyPath =
    'M ' + (cx + rx) + ' ' + cy
    + ' C ' + (cx+rx) + ' ' + (cy-cpV) + ' ' + (cx+cpH) + ' ' + bTop + ' ' + cx + ' ' + bTop
    + ' C ' + (cx-cpH) + ' ' + bTop + ' ' + bLeft + ' ' + (cy-cpV) + ' ' + bLeft + ' ' + cy
    + ' C ' + bLeft + ' ' + (cy+cpV) + ' ' + (cx-cpH) + ' ' + bBot + ' ' + cx + ' ' + bBot
    + ' C ' + (cx+cpH) + ' ' + bBot + ' ' + (cx+rx) + ' ' + (cy+cpV) + ' ' + (cx+rx) + ' ' + cy
    + ' Z';

  // eel はもっと細長い特有形状
  if (profile === 'eel') {
    bodyPath =
      'M ' + (cx + rx) + ' ' + cy
      + ' Q ' + (cx + rx*0.6) + ' ' + (cy - ry) + ' ' + cx + ' ' + (cy - ry)
      + ' Q ' + (cx - rx*0.5) + ' ' + (cy - ry) + ' ' + (cx - rx) + ' ' + cy
      + ' Q ' + (cx - rx*0.5) + ' ' + (cy + ry) + ' ' + cx + ' ' + (cy + ry)
      + ' Q ' + (cx + rx*0.6) + ' ' + (cy + ry) + ' ' + (cx + rx) + ' ' + cy
      + ' Z';
  }

  var bodyFill = filled ? '#3a3a3a' : fillColor;
  var belly    = filled ? '#3a3a3a' : (m.colors ? (m.colors.belly || '#dde') : '#dde');
  var backCol  = filled ? '#3a3a3a' : (m.colors ? (m.colors.back  || '#223344') : '#223344');
  var finFill  = filled ? '#444'    : (m.colors ? (m.colors.fins  || '#557788') : '#557788');

  // グラデーション ID (衝突防止)
  var gid = 'fish-g-' + (species ? species.id : 'unk') + '-' + (filled ? 'u' : 'k');

  var svgStr =
    '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '">'
    + '<defs>'
    + '<linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1">'
    + '<stop offset="0%" stop-color="' + backCol + '"/>'
    + '<stop offset="60%" stop-color="' + bodyFill + '"/>'
    + '<stop offset="100%" stop-color="' + belly + '"/>'
    + '</linearGradient>'
    + '</defs>';

  // 尾ひれ
  if (tailPath) {
    svgStr += '<path d="' + tailPath + '" fill="' + finFill + '" stroke="' + strokeColor + '" stroke-width="0.8" opacity="0.9"/>';
  }
  // 背びれ
  if (dorsalPath) {
    svgStr += '<path d="' + dorsalPath + '" fill="' + finFill + '" stroke="' + strokeColor + '" stroke-width="0.8" opacity="0.8"/>';
  }
  // ボディ
  svgStr += '<path d="' + bodyPath + '" fill="url(#' + gid + ')" stroke="' + strokeColor + '" stroke-width="1"/>';

  // 目
  if (!filled) {
    var eyeColor = m.colors ? (m.colors.eye || '#111') : '#111';
    svgStr += '<circle cx="' + eyeX + '" cy="' + eyeY + '" r="' + eyeRad + '" fill="' + eyeColor + '"/>'
      + '<circle cx="' + (eyeX - eyeRad*0.3) + '" cy="' + (eyeY - eyeRad*0.3) + '" r="' + (eyeRad*0.28) + '" fill="rgba(255,255,255,0.7)"/>';
  }
  svgStr += '</svg>';
  return svgStr;
}

/* ---------- 星評価ヘルパー ---------- */
function UIStars(n, max) {
  max = max || 5;
  var s = '';
  for (var i = 1; i <= max; i++) {
    s += i <= n ? '★' : '☆';
  }
  return s;
}

/* ---------- 時刻文字列ヘルパー ---------- */
function UITimeString(timeOfDay) {
  // timeOfDay 0..1 → HH:MM 風文字列 (ゲーム内1日)
  var totalMin = Math.floor(timeOfDay * 24 * 60);
  var h = Math.floor(totalMin / 60) % 24;
  var m = totalMin % 60;
  return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
}

function UITimeIcon(timeOfDay) {
  if (timeOfDay < 0.25)  return '🌅'; // 朝
  if (timeOfDay < 0.55)  return '☀️'; // 昼
  if (timeOfDay < 0.75)  return '🌆'; // 夕
  return '🌙';                         // 夜
}
